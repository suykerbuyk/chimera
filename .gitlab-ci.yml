default:
    tags:
        - k8s
variables:
  QB_TAG: ci-${CI_PROJECT_NAME}-${CI_PIPELINE_IID}
  GIT_SUBMODULE_STRATEGY: recursive
  QB_PROJECT: chimera
  RUN_QB: qb --plain -o ${QB_TAG} -i ${QB_PROJECT}/${QB_TAG} -b ${CI_PIPELINE_IID} --pod-running-timeout=10m

stages:
  - builders
  - build
  - check
  - publish

chimera-dev:
  stage: builders
  script:
    - ${RUN_QB} chimera-dev

builder_Ubuntu24:
  stage: builders
  script:
    - ${RUN_QB} builder_Ubuntu24

builder_Ubuntu26:
  stage: builders
  script:
    - ${RUN_QB} builder_Ubuntu26

builder_Ubuntu22:
  stage: builders
  script:
    - ${RUN_QB} builder_Ubuntu22

builder_Rocky9:
  stage: builders
  script:
    - ${RUN_QB} builder_Rocky9

build_release_Ubuntu22:
  stage: build
  needs: [ builder_Ubuntu22 ]
  script:
    - ${RUN_QB} build_release_Ubuntu22

build_debug_Ubuntu22:
  stage: build
  needs: [ builder_Ubuntu22 ]
  script:
    - ${RUN_QB} build_debug_Ubuntu22

build_release_Ubuntu24:
  stage: build
  needs: [ builder_Ubuntu24 ]
  script:
    - ${RUN_QB} build_release_Ubuntu24

build_debug_Ubuntu24:
  stage: build
  needs: [ builder_Ubuntu24 ]
  script:
    - ${RUN_QB} build_debug_Ubuntu24

build_release_Ubuntu26:
  stage: build
  needs: [ builder_Ubuntu26 ]
  script:
    - ${RUN_QB} build_release_Ubuntu26

build_debug_Ubuntu26:
  stage: build
  needs: [ builder_Ubuntu26 ]
  script:
    - ${RUN_QB} build_debug_Ubuntu26

build_release_Rocky9:
  stage: build
  needs: [ builder_Rocky9 ]
  script:
    - ${RUN_QB} build_release_Rocky9

build_debug_Rocky9:
  stage: build
  needs: [ builder_Rocky9 ]
  script:
    - ${RUN_QB} build_debug_Rocky9

syntax:
  stage: check
  needs: [ chimera-dev ]
  script:
    - ${RUN_QB} syntax

static_analysis:
  stage: check
  needs: [ chimera-dev ]
  parallel:
    matrix:
      - MODE: [ release, debug ]
        ARCH: [ arm64, amd64 ]
  script:
    - >
      if ! ${RUN_QB} -a ${ARCH} -v static_analysis_${MODE} ; then
         echo "Static Analysis Fail generating report"
         ${RUN_QB} -a ${ARCH} static_analysis_${MODE}_report
         false
      fi &> static_analysis_${MODE}_${ARCH}.log
  after_script:
    - tail -1000 static_analysis_${MODE}_${ARCH}.log || true
  artifacts:
    when: always
    paths:
      - static_analysis_${MODE}_${ARCH}.log
    expire_in: 1 week

ctest:
  stage: check
  needs: [ chimera-dev ]
  parallel:
    matrix:
      - MODE: [ release, debug ]
        ARCH: [ arm64, amd64 ]
  script:
    - ${RUN_QB} -a ${ARCH} -v ctest_${MODE} &> ctest_${MODE}_${ARCH}.log
  after_script:
    - tail -1000 ctest_${MODE}_${ARCH}.log || true
  artifacts:
    when: always
    paths:
      - ctest_${MODE}_${ARCH}.log
    expire_in: 1 week


release:
  stage: publish
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+(-.+)?$/'
  script:
    - >-
      qb assets copy --path ${QB_PROJECT} --tag ${QB_TAG} --dest-tag ${CI_COMMIT_TAG} --out-revision ${CI_PIPELINE_IID}
      -U $publish_username -P $publish_password -I $publish_raw_source -O $publish_raw_dest_internal

dev_branch:
  stage: publish
  only:
    - develop
  except: [ schedules, tags ]
  script:
    - >-
      qb image copy --path ${QB_PROJECT}/builder_ubuntu22 --old ${QB_TAG} --new ${CI_COMMIT_REF_SLUG}
      -U $publish_username -P $publish_password -I $publish_docker_source -O $publish_docker_dest_development
    - >-
      qb image copy --path ${QB_PROJECT}/builder_ubuntu24 --old ${QB_TAG} --new ${CI_COMMIT_REF_SLUG}
      -U $publish_username -P $publish_password -I $publish_docker_source -O $publish_docker_dest_development
    - >-
      qb image copy --path ${QB_PROJECT}/builder_rocky9 --old ${QB_TAG} --new ${CI_COMMIT_REF_SLUG}
      -U $publish_username -P $publish_password -I $publish_docker_source -O $publish_docker_dest_development
    - >-
      qb image copy --path ${QB_PROJECT}/chimera-dev --old ${QB_TAG} --new ${CI_COMMIT_REF_SLUG}
      -U $publish_username -P $publish_password -I $publish_docker_source -O $publish_docker_dest_development
    - >-
      qb assets copy --path ${QB_PROJECT} --tag ${QB_TAG} --out-revision ${CI_PIPELINE_IID} --dest-tag ${CI_COMMIT_BRANCH}
      -U $publish_username -P $publish_password -I $publish_raw_source -O $publish_raw_dest_development
