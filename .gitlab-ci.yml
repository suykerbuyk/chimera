default:
    tags:
        - k8s
variables:
  QB_TAG: ci-${CI_PROJECT_NAME}-${CI_PIPELINE_IID}
  GIT_SUBMODULE_STRATEGY: recursive
  QB_PROJECT: chimera
  RUN_QB: ./qb/qb -g -o ${QB_TAG} -i ${QB_PROJECT}/${QB_TAG} -b ${CI_PIPELINE_IID} --pod-running-timeout=10m

stages:
  - builders
  - build
  - publish

builder_Ubuntu24:
  stage: builders
  script:
    - ${RUN_QB} builder_Ubuntu24

builder_Ubuntu22:
  stage: builders
  script:
    - ${RUN_QB} builder_Ubuntu22

builder_Rocky9:
  stage: builders
  script:
    - ${RUN_QB} builder_Rocky9

build_debug_Ubuntu22:
  stage: build
  script:
    - ${RUN_QB} build_debug_Ubuntu22

build_release_Ubuntu24:
  stage: build
  script:
    - ${RUN_QB} build_release_Ubuntu24

build_debug_Ubuntu24:
  stage: build
  script:
    - ${RUN_QB} build_debug_Ubuntu24

build_release_Ubuntu22:
  stage: build
  script:
    - ${RUN_QB} build_release_Ubuntu22

build_debug_Rocky9:
  stage: build
  script:
    - ${RUN_QB} build_debug_Rocky9

build_release_Rocky9:
  stage: build
  script:
    - ${RUN_QB} build_release_Rocky9

syntax_Ubuntu22:
  stage: build
  script:
    - ${RUN_QB} syntax_Ubuntu22

syntax_Ubuntu24:
  stage: build
  script:
    - ${RUN_QB} syntax_Ubuntu24

release:
  stage: publish
  only:
    - tags
  script:
    - >-
      ./qb/copy_assets --remove -p ${QB_PROJECT} -o ${QB_TAG} -n ${CI_COMMIT_TAG} --out_revision ${CI_PIPELINE_IID}
      -U $publish_username -P $publish_password -I $publish_raw_source -O $publish_raw_dest_internal

dev_branch:
  stage: publish
  only:
    - main-quantum
  except: [ schedules, tags ]
  script:
    - >-
      ./qb/copy_image -p ${QB_PROJECT}/builder_ubuntu22 -o ${QB_TAG} -n ${CI_COMMIT_REF_SLUG}
      -U $publish_username -P $publish_password -I $publish_docker_source -O $publish_docker_dest_development
    - >-
      ./qb/copy_image -p ${QB_PROJECT}/builder_ubuntu24 -o ${QB_TAG} -n ${CI_COMMIT_REF_SLUG}
      -U $publish_username -P $publish_password -I $publish_docker_source -O $publish_docker_dest_development
    - >-
      ./qb/copy_image -p ${QB_PROJECT}/builder_rocky9 -o ${QB_TAG} -n ${CI_COMMIT_REF_SLUG}
      -U $publish_username -P $publish_password -I $publish_docker_source -O $publish_docker_dest_development
    - >-
      ./qb/copy_assets --remove -p ${QB_PROJECT} -o ${QB_TAG} --out_revision ${CI_PIPELINE_IID} -n ${CI_COMMIT_BRANCH}
      -U $publish_username -P $publish_password -I $publish_raw_source -O $publish_raw_dest_development
