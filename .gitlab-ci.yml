default:
    tags:
        - k8s
variables:
  QB_TAG: ci-${CI_PROJECT_NAME}-${CI_PIPELINE_IID}
  GIT_SUBMODULE_STRATEGY: recursive
  # Full history: qb finds the nearest <X.Y.Z>-myriad* tag by walking this
  # clone (QB_BUILD_GIT_DESCRIBE_TAG, which qtm_build/pkg_version.sh turns into
  # the package version), and GitLab's default shallow clone (depth 20) leaves
  # no tag reachable on develop / merge-train / nightly pipelines.
  GIT_DEPTH: 0
  QB_PROJECT: chimera
  RUN_QB: qb --plain -o ${QB_TAG} -i ${QB_PROJECT}/${QB_TAG} -b ${CI_PIPELINE_IID} --pod-running-timeout=10m

# Control which pipelines get created at all.  Merge trains are enabled in the
# project settings (Settings -> Merge requests: "Merged results pipelines" +
# "Merge trains" + "Pipelines must succeed").  These rules are the CI-side half:
# allow MR pipelines (detached / merged-result per push, and the merge train),
# the post-merge develop pipeline, the nightly schedule, and release tags.
workflow:
  rules:
    # Tags matching X.Y.Z[-suffix]: build + publish only (no tests).  Any other
    # tag creates no pipeline at all.
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+(-.+)?$/'
    # Nightly / scheduled full-suite run (add a pipeline schedule on 'develop').
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    # MR pipelines: detached + merged-result (per push) and the merge train.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Post-merge pipeline on develop: build + publish only (no re-test).
    - if: '$CI_COMMIT_BRANCH == "develop"'
    # Any other branch push gets no pipeline -- CI runs through its MR instead.

# Shared rule sets (YAML anchors), one per behaviour:
#
#   rules_fast  -- quick feedback on every MR push (detached / merged-result),
#                  plus the train and nightly.  Used by syntax, static_analysis,
#                  and the quint quick-tier legs (ctest_quint, quint_coverage).
#   rules_build -- compile + publishable assets: in the train (pre-merge check),
#                  on develop and tags (publish) and nightly.  NOT on per-push MR
#                  pipelines, so review-time CI stays fast.
#   rules_full  -- the gate: runs automatically in the merge train (which tests
#                  the merged result) and nightly, and is available as an opt-in
#                  (manual) job on an MR push.  Used by ctest.
#   rules_explore -- nightly only: the full smbtorture matrix, ~3900 cells and
#                  purely informational.  None of the sets above fits because
#                  they all also fire on MR or train events, and a full matrix
#                  has no business gating a merge.  A measured run is ~28min
#                  (3930 cells at parallel=12, no cell reaching its 300s
#                  ceiling), so it sits comfortably in the nightly.
#
# chimera-dev has its own rules (below): it is both a test dependency (MR push,
# train, nightly) AND the image published on develop, so it also runs on the
# develop pipeline.
#
# The two JIRA jobs (jira_validation, jira_update) carry their own rules too;
# their comments say why.
#
# Tags get NO testing -- just builders + builds + publish -- and only for tags
# matching X.Y.Z[-suffix]; any other tag creates no pipeline at all.
#
.rules_fast: &rules_fast
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_PIPELINE_SOURCE == "schedule"'

.rules_build: &rules_build
  - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"'
  - if: '$CI_COMMIT_BRANCH == "develop"'
  - if: '$CI_PIPELINE_SOURCE == "schedule"'
  - if: '$CI_COMMIT_TAG'

.rules_full: &rules_full
  - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"'
  - if: '$CI_PIPELINE_SOURCE == "schedule"'
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    when: manual
    allow_failure: true

.rules_explore: &rules_explore
  - if: '$CI_PIPELINE_SOURCE == "schedule"'

stages:
  - validate
  - builders
  - build
  - check
  - publish

# The JIRA gate.  Chimera has no GitLab pre-receive hook (myriad does), so this
# job is the only thing that enforces a JIRA key on a merge: it must pass in the
# merge train, and it also runs on every MR push, so a missing or unknown key
# shows up at review time rather than when the MR reaches the train.  It is
# alone in the first stage, so a failure stops the pipeline before any builder
# starts.
#
# qb takes keys from the merge commit message (the MR title, through the merge
# commit template) and from the first line of every commit the merge brings in,
# and fails when it finds none or when any key it finds is not a JIRA issue.
# A "BypassMerge" line or "NOJIRA" anywhere skips the check.  Only a merge
# commit into develop, main, master or release/* is checked.  Editing the MR
# title starts no pipeline: re-run it after fixing a key.
#
# Two kinds of MR pipeline are treated differently:
#   - detached (no merged result, e.g. a conflict): not run.  Such a pipeline
#     tests the source head, and when that head is itself a merge (a sync of
#     origin/main into the topic branch) qb would judge it as the MR's own
#     merge and reject a legitimate MR.
#   - Draft: run, but allowed to fail.  GitLab keeps the "Draft: " prefix on
#     the title line of the merge commit message, where qb looks for the key,
#     so a Draft whose commits carry no key would fail and hold back all
#     review-time CI.  A Draft cannot enter the train, which checks the ready
#     title.
# For both, the merge train is the gate, so merging such an MR with "Merge
# immediately" (which skips the train) goes unchecked.
#
# Credentials come from ~/.jira_user on the shared k8s runner, not from CI/CD
# variables: protected variables do not reach a merge request pipeline from an
# unprotected branch, and that file is also what myriad's train job uses.  The
# job needs full history (the global GIT_DEPTH: 0) for qb's merged-commit walk,
# but no submodules.
jira_validation:
  stage: validate
  rules:
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "detached"'
      when: never
    - if: '$CI_MERGE_REQUEST_DRAFT == "true"'
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - git log -1
    - qb jira check --commit ${CI_COMMIT_SHA} --ref-name ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}

chimera-dev:
  stage: builders
  # Test dependency (MR push, train, nightly) AND the image we publish on
  # develop, so it spans the fast set plus the develop pipeline.  Not on tags
  # (tag publish copies assets only, not this image).
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
  script:
    - ${RUN_QB} chimera-dev

builder_Ubuntu24:
  stage: builders
  rules: *rules_build
  script:
    - ${RUN_QB} builder_Ubuntu24

builder_Ubuntu26:
  stage: builders
  rules: *rules_build
  script:
    - ${RUN_QB} builder_Ubuntu26

builder_Ubuntu22:
  stage: builders
  rules: *rules_build
  script:
    - ${RUN_QB} builder_Ubuntu22

builder_Rocky9:
  stage: builders
  rules: *rules_build
  script:
    - ${RUN_QB} builder_Rocky9

build_release_Ubuntu22:
  stage: build
  needs: [ builder_Ubuntu22 ]
  rules: *rules_build
  script:
    - ${RUN_QB} build_release_Ubuntu22

build_debug_Ubuntu22:
  stage: build
  needs: [ builder_Ubuntu22 ]
  rules: *rules_build
  script:
    - ${RUN_QB} build_debug_Ubuntu22

build_release_Ubuntu24:
  stage: build
  needs: [ builder_Ubuntu24 ]
  rules: *rules_build
  script:
    - ${RUN_QB} build_release_Ubuntu24

build_debug_Ubuntu24:
  stage: build
  needs: [ builder_Ubuntu24 ]
  rules: *rules_build
  script:
    - ${RUN_QB} build_debug_Ubuntu24

build_release_Ubuntu26:
  stage: build
  needs: [ builder_Ubuntu26 ]
  rules: *rules_build
  script:
    - ${RUN_QB} build_release_Ubuntu26

build_debug_Ubuntu26:
  stage: build
  needs: [ builder_Ubuntu26 ]
  rules: *rules_build
  script:
    - ${RUN_QB} build_debug_Ubuntu26

build_release_Rocky9:
  stage: build
  needs: [ builder_Rocky9 ]
  rules: *rules_build
  script:
    - ${RUN_QB} build_release_Rocky9

build_debug_Rocky9:
  stage: build
  needs: [ builder_Rocky9 ]
  rules: *rules_build
  script:
    - ${RUN_QB} build_debug_Rocky9

syntax:
  stage: check
  needs: [ chimera-dev ]
  rules: *rules_fast
  script:
    - ${RUN_QB} syntax

static_analysis:
  stage: check
  needs: [ chimera-dev ]
  rules: *rules_fast
  parallel:
    matrix:
      # amd64 only: the chimera-dev image this job runs in is amd64-only (its
      # packages.lock has no arm64 closure and no arm64 build infra exists to
      # generate one), so an arm64 entry here would have no image to schedule
      # into.  Restore arm64 here if chimera-dev regains an arm64 build.
      - MODE: [ release, debug ]
        ARCH: [ amd64 ]
  script:
    - >
      if ! ${RUN_QB} -a ${ARCH} -v static_analysis_${MODE} ; then
         echo "Static Analysis Fail generating report"
         ${RUN_QB} -a ${ARCH} static_analysis_${MODE}_report
         false
      fi &> static_analysis_${MODE}_${ARCH}.log
  after_script:
    - tail -1000 static_analysis_${MODE}_${ARCH}.log || true
  artifacts:
    when: always
    paths:
      - static_analysis_${MODE}_${ARCH}.log
    expire_in: 1 week

ctest:
  stage: check
  needs: [ chimera-dev ]
  rules: *rules_full
  retry:
    max: 1
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
  parallel:
    matrix:
      # Each leg pairs a short GROUP (used for the log file name) with the full
      # ctest selector in CTEST_FILTER.  One matrix entry per leg so the two
      # stay paired (a single dict would cross-product them); MODE and ARCH are
      # the 2-way axes.
      #
      # The groups are cut by measured cost, not by tidiness.  From the
      # 2026-09-11 nightly (release amd64, the whole non-pynfs half in one leg,
      # 27.9 min of ctest):
      #
      #   smbtorture  1753 tests  10070 s*proc   14.0 min at -j 12
      #   wpts          60 tests   4890 s*proc   14.6 min -- see below
      #   everything else        ~5070 s*proc    7.0 min
      #
      # so smbtorture and wpts are the only two worth their own leg; splitting
      # the remainder further buys nothing.  wpts is bounded by a single test
      # (wpts-smb2model/memfs_s14, 874 s) rather than by parallelism, which is
      # why it costs as much as smbtorture in 3% of the tests, and why 14.6 min
      # is the floor for this job however finely the rest is cut.
      #
      # Upstream splits the same suite nine ways in .github/workflows/
      # extended.yml; its selectors partition our tree exactly (verified: 8690
      # tests, none in two shards, none uncovered), so adopting more of them
      # later is a pure addition.  Measured here first: past these four groups
      # the critical path does not move, and each extra leg pays its own ~4 min
      # build.
      #
      # Every label selector is ANCHORED.  ctest -L takes a regex and ANDs
      # repeated -L flags, so an unanchored name silently pulls in every label
      # that contains it -- upstream measured -L posix also selecting posix_mbt.
      # No label collides today (-L pynfs and -L ^pynfs$ both select 1376), so
      # this is purely defensive; the dangerous direction is the "rest" leg's
      # -LE, where a future colliding label would be dropped from the run
      # rather than duplicated.  The -LE list must name exactly the groups that
      # have a leg above, or what it excludes runs nowhere.  ^kvm$ is there
      # because the ctest_* qb tasks build with KVM_TESTING=OFF; the guest
      # suites have their own legs (ctest_kvm, ctest_kvm_images).
      #
      # The regex is single-quoted INSIDE the value: qb pastes CTEST_FILTER
      # into the ctest command line textually, so an unquoted $ or | would be
      # parsed as shell syntax.  The flag and regex stay outside the quotes so
      # they split into separate ctest args.
      #
      # pynfs keeps the -E diskfs_ exclusion from CHIM-125, which dropped the
      # diskfs_ variants as ~33% of pynfs runtime "for little protocol-level
      # coverage".  Those 448 tests now run in ctest_explore below rather than
      # in no leg at all; the three pynfs selectors partition the label exactly
      # (928 + 448 = 1376, verified by direct count).
      #
      # amd64 only: the arm64 runners are not reliable enough to gate on.  The
      # qb ctest_* tasks are amd64-only to match, so an arm64 entry here would
      # just fail to schedule.  Restore both together.
      #
      # CHIM-242 gates two upstream extended-tier regressions that arrived
      # with the 2026-10-07 sync (sync-code-20261007).  Upstream's merge queue
      # runs only the quick tier; its extended workflow is red on main with
      # the same tests, so they can land there green and fail this train.
      # Named exclusions with the reason beside them, removed by the fix:
      #   smbtorture: smb2.compound, smb2.replay.channel_sequence and
      #     smb2.replay.replay_commands on the linux and io_uring backends
      #     (compound.related3 gets INVALID_DEVICE_REQUEST); memfs passes.
      #   rest: libevpl's own io_uring TCP self-tests, broken by the libevpl
      #     bump 8a3db7c7 -> 8da8acff (recv_bundle EINVAL, then timeouts).
      # Same shape as the CHIM-197 nfstest_alloc gate below.
      - MODE: [ release, debug ]
        ARCH: [ amd64 ]
        GROUP: [ pynfs ]
        CTEST_FILTER: [ "-L '^pynfs$' -E diskfs_" ]
      - MODE: [ release, debug ]
        ARCH: [ amd64 ]
        GROUP: [ smbtorture ]
        CTEST_FILTER: [ "-L '^smbtorture$' -E 'smbtorture_smb2_(compound|replay_channel_sequence|replay_replay_commands)_(linux|io_uring)$'" ]
      - MODE: [ release, debug ]
        ARCH: [ amd64 ]
        GROUP: [ wpts ]
        CTEST_FILTER: [ "-L '^wpts$'" ]
      - MODE: [ release, debug ]
        ARCH: [ amd64 ]
        GROUP: [ rest ]
        CTEST_FILTER: [ "-LE '^pynfs$|^smbtorture$|^wpts$|^kvm$' -E 'libevpl/io_uring/(hello_world_stream_tcp|hello_world_connected_msg_tcp|ping_pong_stream_tcp|ping_pong_msg_tcp|bulk_msg_tcp|bulk_stream_tcp)$'" ]
  script:
    - ${RUN_QB} -a ${ARCH} -v ctest_${MODE} -V CTEST_FILTER="${CTEST_FILTER}" &> ctest_${MODE}_${GROUP}_${ARCH}.log
  after_script:
    - tail -1000 ctest_${MODE}_${GROUP}_${ARCH}.log || true
  artifacts:
    when: always
    paths:
      - ctest_${MODE}_${GROUP}_${ARCH}.log
    expire_in: 1 week

# The ctest groups the merge train does not gate on.  Nightly only, the same
# treatment the extra guest images get in ctest_kvm_images, and for the same
# reason: rules: cannot vary per matrix cell, so a nightly-only leg cannot just
# be another entry in the matrix above.
#
# pynfs-on-diskfs is the whole of it today.  CHIM-125 (1b0d8a91) excluded the
# diskfs_ variants from the pynfs leg as ~33% of its runtime "for little
# protocol-level coverage", noting that "diskfs stays exercised by the posix and
# client suites".  That is true of diskfs generally but not of pynfs-on-diskfs:
# with the exclusion in place no NFSv4 protocol conformance ran against the
# diskfs backend anywhere in this pipeline.  Two things have changed since --
# upstream's pynfs shard runs them (its selector carries no -E), and the
# 2026-09-11 drop was largely diskfs work (space-map, transaction rollback,
# crash recovery), which is the backend these tests cover.
#
# Nightly rather than in the train because that buys the coverage without
# putting 448 tests in front of a merge, and because they have not run here
# since CHIM-125 -- they are new signal first and a gate only once their
# failures are understood.  Promote to the ctest matrix above at that point.
ctest_explore:
  stage: check
  needs: [ chimera-dev ]
  rules: *rules_explore
  retry:
    max: 1
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
  parallel:
    matrix:
      - MODE: [ release, debug ]
        ARCH: [ amd64 ]
        GROUP: [ pynfs_diskfs ]
        CTEST_FILTER: [ "-L '^pynfs$' -R diskfs_" ]
  script:
    - ${RUN_QB} -a ${ARCH} -v ctest_${MODE} -V CTEST_FILTER="${CTEST_FILTER}" &> ctest_${MODE}_${GROUP}_${ARCH}.log
  after_script:
    - tail -1000 ctest_${MODE}_${GROUP}_${ARCH}.log || true
  artifacts:
    when: always
    paths:
      - ctest_${MODE}_${GROUP}_${ARCH}.log
    expire_in: 1 week

# The quint quick tier as an automatic per-push MR gate: the quint model-based
# tests are upstream's cheap proxy for the full suite (a plain `ctest` runs
# only them), so they are what an MR push can afford to run every time --
# unlike the full `ctest` job above, which stays manual on pushes and
# automatic only in the train.
ctest_quint:
  stage: check
  needs: [ chimera-dev ]
  rules: *rules_fast
  retry:
    max: 1
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
  parallel:
    matrix:
      # amd64 only, as for the ctest job above.
      - MODE: [ release, debug ]
        ARCH: [ amd64 ]
  script:
    - ${RUN_QB} -a ${ARCH} -v ctest_quint_${MODE} &> ctest_quint_${MODE}_${ARCH}.log
  after_script:
    - tail -1000 ctest_quint_${MODE}_${ARCH}.log || true
  artifacts:
    when: always
    paths:
      - ctest_quint_${MODE}_${ARCH}.log
    expire_in: 1 week

# Quint coverage report for the MR: the same markdown that lands on upstream
# PRs (per-component functions/lines/branches table plus the patch-coverage
# section), surfaced in the MR widget via artifacts:expose_as.  The diff is
# captured on the runner and written into the checkout, so it rides into the
# qb context as /context/pr.diff; an empty diff (non-MR pipeline, or an
# unfetchable base) just drops the patch section.  Informational, like
# coverage: the qb task swallows test failures (ctest_quint is the gate), so
# a script failure means a build/report problem -- not retried.
quint_coverage:
  stage: check
  needs: [ chimera-dev ]
  rules: *rules_fast
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  script:
    - git diff -U0 "${CI_MERGE_REQUEST_DIFF_BASE_SHA:-origin/develop}" HEAD > pr.diff || true
    - ${RUN_QB} -a amd64 -v ctest_quint_coverage -V RUN_URL="${CI_PIPELINE_URL}" &> quint_coverage_amd64.log
    - qb assets download --strip -p ${QB_PROJECT} -t ${QB_TAG} --asset-name quint_coverage_report/amd64/coverage-report.md --output-dir .
    - qb assets download --strip -p ${QB_PROJECT} -t ${QB_TAG} --asset-name quint_coverage_report/amd64/report.tar.gz --output-dir .
    # Extracted rather than shipped as the tarball: the artifact browser
    # serves HTML, so the llvm-cov report is readable in the browser at
    # quint_coverage_report/index.html.  The tarball itself stays
    # downloadable as a qb asset, so it is not stored twice.
    - mkdir -p quint_coverage_report
    - tar -C quint_coverage_report --strip-components=1 -xzf report.tar.gz
    - rm -f report.tar.gz
  after_script:
    - tail -1000 quint_coverage_amd64.log || true
  artifacts:
    when: always
    expose_as: 'Quint coverage report'
    paths:
      - coverage-report.md
      - quint_coverage_report/
      - quint_coverage_amd64.log
    expire_in: 1 week

# Informational coverage leg: the qb task swallows test failures (the ctest
# jobs above are the pass/fail gate), so a script failure here means a
# build/report problem worth surfacing -- script_failure is deliberately not
# retried.
coverage:
  stage: check
  needs: [ chimera-dev ]
  rules: *rules_full
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  script:
    - ${RUN_QB} -a amd64 -v ctest_coverage &> ctest_coverage_amd64.log
    - qb assets download --strip -p ${QB_PROJECT} -t ${QB_TAG} --asset-name coverage_report/amd64/report.tar.gz --output-dir .
    - qb assets download --strip -p ${QB_PROJECT} -t ${QB_TAG} --asset-name coverage_report/amd64/coverage-report.txt --output-dir .
    # Extracted for the same reason as quint_coverage: the artifact browser
    # serves the llvm-cov HTML directly at coverage_report/index.html, and
    # the tarball remains downloadable as a qb asset.
    - mkdir -p coverage_report
    - tar -C coverage_report --strip-components=1 -xzf report.tar.gz
    - rm -f report.tar.gz
  after_script:
    - tail -1000 ctest_coverage_amd64.log || true
  # Scrape the line-coverage percentage from the llvm-cov TOTAL row (echoed by
  # the after_script tail).  Columns with -show-region-summary=false are
  # Functions/Lines/Branches; the second percentage is line coverage.
  coverage: '/^\s*TOTAL(?:\s+\d+){2}\s+[\d.]+%(?:\s+\d+){2}\s+([\d.]+)%/'
  artifacts:
    when: always
    expose_as: 'Coverage report extended'
    paths:
      - ctest_coverage_amd64.log
      - coverage-report.txt
      - coverage_report/
    expire_in: 1 week

# Full-matrix smbtorture measurement.  The gating ctest legs only run the enabled
# baseline, so this is the only thing in CI that measures the currently-failing
# cells; it publishes results.txt, a baseline-drift report, and one log per
# non-passing cell.  Informational (the qb task swallows cell failures), so as
# with coverage a script failure means a build/report problem and is not retried.
#
# Nightly only -- never on an MR or in the train, since a full matrix has no
# business gating a merge.  A narrow run can be driven from the schedule by
# setting SMBTORTURE_BACKENDS / SMBTORTURE_FILTER (scheduled-pipeline variables
# outrank the job-level defaults below).
#
# Retrieve the results outside CI with:
#   qb assets download --strip -p chimera -t <QB_TAG> \
#       --asset-name smbtorture_explore/amd64/results.tar.gz --output-dir .
smbtorture_explore:
  stage: check
  needs: [ chimera-dev ]
  rules: *rules_explore
  # A measured full matrix is ~28min (3930 cells at parallel=12, no cell hitting
  # its 300s ceiling), so this is ~4x headroom rather than a real expectation --
  # enough that a slow runner never trips it, tight enough that a wedged leg
  # fails the same night instead of holding a runner until morning.
  timeout: 2h
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  variables:
    SMBTORTURE_BACKENDS: ""
    SMBTORTURE_FILTER: ""
    SMBTORTURE_PARALLEL: ""
  script:
    - >
      ${RUN_QB} -a amd64 -v smbtorture_explore
      -V SMBTORTURE_BACKENDS="${SMBTORTURE_BACKENDS}"
      -V SMBTORTURE_FILTER="${SMBTORTURE_FILTER}"
      -V SMBTORTURE_PARALLEL="${SMBTORTURE_PARALLEL}"
      &> smbtorture_explore_amd64.log
    - qb assets download --strip -p ${QB_PROJECT} -t ${QB_TAG} --asset-name smbtorture_explore/amd64/results.tar.gz --output-dir .
    - qb assets download --strip -p ${QB_PROJECT} -t ${QB_TAG} --asset-name smbtorture_explore/amd64/smbtorture-report.txt --output-dir .
  after_script:
    - tail -1000 smbtorture_explore_amd64.log || true
  artifacts:
    when: always
    paths:
      - smbtorture_explore_amd64.log
      - smbtorture-report.txt
      - results.tar.gz
    expire_in: 1 week

ctest_kvm:
  stage: check
  needs: [ chimera-dev ]
  rules: *rules_full
  retry:
    max: 1
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
  parallel:
    matrix:
      # The KVM legs shard by GUEST IMAGE, not by suite.  That is also what each
      # shard has to download: one ~3.4 GB image instead of all four.  nfstest and
      # ltp are peeled into a shard of their own on the images that carry them,
      # because there those two suites cost more than everything else on the image
      # combined.
      #
      # Sharding this way is what retires the hand-maintained exclude list the old
      # "other" leg carried: the complement of a two-way nfstest|ltp peel is exact,
      # so no suite can fall between the legs.  What it cannot check by itself is a
      # whole image having no leg at all, so qb.yaml's ctest_kvm holds the
      # canonical shard list in KVM_SHARDS and fails the leg when it stops covering
      # the configure.  Update the two together.
      #
      # This job is ubuntu2604 only -- the one image the merge train has ever
      # gated on.  The other three run nightly, in ctest_kvm_images below.
      #
      # Each entry pairs a KVM_NAME (used for the log file name) with the full
      # ctest selector in KVM_FILTER.  One matrix entry per shard so the two stay
      # paired (a single dict would cross-product them); MODE is the 2-way axis.
      #
      # The regex is single-quoted INSIDE the value: qb pastes KVM_FILTER into the
      # ctest command line textually, so an unquoted ( or | would be parsed as
      # shell syntax ("syntax error: ( unexpected").  The flag and regex stay
      # space-separated and outside the quotes so they split into two ctest args.
      - MODE: [ Release, Debug ]
        ARCH: [ amd64 ]
        PLATFORM: [ ubuntu2604 ]
        KVM_NAME: [ ubuntu2604 ]
        KVM_FILTER: [ "-E '/(nfstest|ltp)/'" ]
      # nfstest_alloc on diskfs (both the io_uring and the aio variant) is
      # still excluded, but for much less than it was.  Upstream re-enabled it
      # in the 2026-09-07 sync (befd69b9, "issue #733 fixed"), and in this leg
      # both variants then failed alloc02 outright -- "File size should be
      # correct after allocate ... got 0" -- after which the guest hung until
      # the harness watchdog fired, 82 minutes per test.
      #
      # Re-measured on the 2026-09-11 sync (CHIM-202): every ordinary allocate
      # case now PASSES and each test fails in ~146 s.  What is left is one
      # case, "Allocate should succeed when allocating the maximum number of
      # blocks left on the device", which returns ENOSPC; the trailing "got 0"
      # file-size assertion is that failure's consequence, not a second bug.
      # The diskfs space-map and transaction-rollback work in that drop
      # (fb68de02, 98e7a0a3, 6943d50a, ad2bf282) is what closed the rest, and
      # 9d242f57 plus the 900 s nfstest timeout are what bounded the cost.
      #
      # So this is now a narrow ENOSPC-boundary defect rather than a broken
      # ALLOCATE, and re-testing it costs minutes instead of hours.  The memfs
      # variant keeps running.  Remove the -E once diskfs can allocate the last
      # free blocks on a full device.
      - MODE: [ Release, Debug ]
        ARCH: [ amd64 ]
        PLATFORM: [ ubuntu2604 ]
        KVM_NAME: [ ubuntu2604-nfstest ]
        KVM_FILTER: [ "-R '/(nfstest|ltp)/' -E 'nfstest_alloc_diskfs'" ]
  script:
    - ${RUN_QB} -a ${ARCH} -v ctest_kvm -V MODE="${MODE}" -V PLATFORM="${PLATFORM}" -V KVM_FILTER="${KVM_FILTER}" &> ctest_kvm_${MODE}_${ARCH}_${KVM_NAME}.log
  after_script:
    - tail -1000 ctest_kvm_${MODE}_${ARCH}_${KVM_NAME}.log || true
  artifacts:
    when: always
    paths:
      - ctest_kvm_${MODE}_${ARCH}_${KVM_NAME}.log
    expire_in: 1 week

# The three guest images the merge train does not gate on.  Nightly only: they
# have never run here, so they are a source of new signal rather than a gate,
# and keeping them off the train leaves its KVM cost where it is today.  Promote
# an image to ctest_kvm once its failures are understood and it is worth
# blocking a merge on.
#
# ubuntu2404 is the only one of the three that carries nfstest/ltp, so it is the
# only one with a -nfstest shard.  Everything here must stay in step with
# KVM_SHARDS in qb.yaml, which is what fails the leg when the set drifts.
ctest_kvm_images:
  stage: check
  needs: [ chimera-dev ]
  rules: *rules_explore
  retry:
    max: 1
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
  parallel:
    matrix:
      - MODE: [ Release, Debug ]
        ARCH: [ amd64 ]
        PLATFORM: [ ubuntu2404 ]
        KVM_NAME: [ ubuntu2404 ]
        KVM_FILTER: [ "-E '/(nfstest|ltp)/'" ]
      # Same ENOSPC-boundary exclusion as the ubuntu2604 nfstest shard above:
      # the defect is in diskfs, not in the guest image.
      - MODE: [ Release, Debug ]
        ARCH: [ amd64 ]
        PLATFORM: [ ubuntu2404 ]
        KVM_NAME: [ ubuntu2404-nfstest ]
        KVM_FILTER: [ "-R '/(nfstest|ltp)/' -E 'nfstest_alloc_diskfs'" ]
      - MODE: [ Release, Debug ]
        ARCH: [ amd64 ]
        PLATFORM: [ ubuntu2404_hwe ]
        KVM_NAME: [ ubuntu2404_hwe ]
        KVM_FILTER: [ "-E '/(nfstest|ltp)/'" ]
      - MODE: [ Release, Debug ]
        ARCH: [ amd64 ]
        PLATFORM: [ ubuntu2204_hwe ]
        KVM_NAME: [ ubuntu2204_hwe ]
        KVM_FILTER: [ "-E '/(nfstest|ltp)/'" ]
  script:
    - ${RUN_QB} -a ${ARCH} -v ctest_kvm -V MODE="${MODE}" -V PLATFORM="${PLATFORM}" -V KVM_FILTER="${KVM_FILTER}" &> ctest_kvm_${MODE}_${ARCH}_${KVM_NAME}.log
  after_script:
    - tail -1000 ctest_kvm_${MODE}_${ARCH}_${KVM_NAME}.log || true
  artifacts:
    when: always
    paths:
      - ctest_kvm_${MODE}_${ARCH}_${KVM_NAME}.log
    expire_in: 1 week

# Post-merge JIRA bookkeeping.  For every key in the merge (found the same way
# as in jira_validation) qb adds a remote link and a comment pointing at the
# merge commit, then applies the "Code Merged" transition where the ticket's
# workflow offers one.  CHIM's workflow has none, so a CHIM ticket gets the
# link and the comment only.  MD's does (In Review -> In Test, resolution "Code
# merged"), so an MD key in a chimera merge moves that MD ticket.  A code drop
# touches every key its commits carry.
#
# A real push to develop only: the nightly schedule runs on develop as well and
# would re-post the last merge three times a week.  needs: [] starts it with the
# pipeline and keeps it off every other job's path -- the code is already
# merged, so a JIRA outage must not hold up dev_branch.  No retry: a retried
# partial run would duplicate the remote link.
jira_update:
  stage: publish
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "push"'
  retry: 0
  variables:
    GIT_SUBMODULE_STRATEGY: none
  script:
    - git log -1
    - qb jira update --commit ${CI_COMMIT_SHA} --ref-name refs/heads/${CI_COMMIT_BRANCH}

release:
  stage: publish
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+(-.+)?$/'
  script:
    - >-
      qb assets copy --path ${QB_PROJECT} --tag ${QB_TAG} --dest-tag ${CI_COMMIT_TAG} --out-revision ${CI_PIPELINE_IID}
      -U $publish_username -P $publish_password -I $publish_raw_source -O $publish_raw_dest_internal

dev_branch:
  stage: publish
  # Publish only on a real push/merge to develop -- not on the nightly schedule
  # (which only tests) and not on tag pipelines (the release job handles those).
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "push"'
  script:
    - >-
      qb image copy --path ${QB_PROJECT}/builder_ubuntu22 --old ${QB_TAG} --new ${CI_COMMIT_REF_SLUG}
      -U $publish_username -P $publish_password -I $publish_docker_source -O $publish_docker_dest_internal
    - >-
      qb image copy --path ${QB_PROJECT}/builder_ubuntu24 --old ${QB_TAG} --new ${CI_COMMIT_REF_SLUG}
      -U $publish_username -P $publish_password -I $publish_docker_source -O $publish_docker_dest_internal
    - >-
      qb image copy --path ${QB_PROJECT}/builder_rocky9 --old ${QB_TAG} --new ${CI_COMMIT_REF_SLUG}
      -U $publish_username -P $publish_password -I $publish_docker_source -O $publish_docker_dest_internal
    - >-
      qb image copy --path ${QB_PROJECT}/chimera-dev --old ${QB_TAG} --new ${CI_COMMIT_REF_SLUG}
      -U $publish_username -P $publish_password -I $publish_docker_source -O $publish_docker_dest_internal
    - >-
      qb assets copy --path ${QB_PROJECT} --tag ${QB_TAG} --out-revision ${CI_PIPELINE_IID} --dest-tag ${CI_COMMIT_BRANCH}
      -U $publish_username -P $publish_password -I $publish_raw_source -O $publish_raw_dest_internal
