  # Code check
  # ---------------------------------------
  # Chimera-dev container
  chimera-dev:
    type: build_container
    architecture: [ amd64, arm64 ]
    dockerfile: builders/dev/Dockerfile
    registry_path: chimera-dev
    context: builders/dev

  syntax:
    type: run_container
    image: chimera-dev
    context: .
    commands:
      - cd /context
      - make syntax-check < /dev/null
      - export BASE=origin/develop
      - make copyright-check <  /dev/null
    dependencies:
      builder:
        project: chimera
        task: chimera-dev
        tag: develop

  # CTEST_FILTER carries the ctest selector for a CI leg (e.g. "-L pynfs -E
  # diskfs_" or "-LE pynfs") so one task serves every test group.  qb
  # substitutes it into the ctest line textually and the token stays UNQUOTED
  # so the flags and arguments split into separate args; empty (the default)
  # runs the full suite.  Each invocation still configures and builds
  # independently because qb tasks run in isolated containers with their own
  # empty /build.
  #
  # The extended test legs (ctest_release / ctest_debug / ctest_coverage)
  # acquire no trace corpus: they configure with -DSPECS_BUNDLE=NONE, which
  # cmake/SpecsBundle.cmake documents as "neither fetch nor build", so the MBT
  # replay ctests are never registered there.  The corpus-free *_probe quint
  # tests still run.  Running the replays is what the ctest_quint_* legs
  # further down exist for, and they are gated on every MR, so repeating them
  # here would only pay for them twice.
  #
  # This replaces an earlier workaround that moved the oras binary aside
  # before cmake, which worked only for as long as the image carried no quint:
  # quint's local provider builds the corpus from ext/specs when no bundle can
  # be fetched, so installing quint (see builders/dev/Dockerfile) would have
  # defeated the trick and re-registered the replays.  SPECS_BUNDLE=NONE
  # suppresses both providers and says what it means.  It is also the only
  # form that survives ${CTEST_FILTER}: a -LE baked in here would be ANDed
  # with the -LE the CI legs pass, and ctest ANDs repeated label options, so
  # the pair would exclude only tests matching BOTH and in practice nothing.
  #
  # ctest_kvm is unaffected -- it runs in its own container and needs oras to
  # pull the guest images.
  #
  # The extended legs pass -C extended: upstream's test tiers (see the
  # add_test override in the top-level CMakeLists.txt) put everything except
  # the quint model-based tests in the extended tier, so a bare `ctest` here
  # would run only the quick tier -- and with SPECS_BUNDLE=NONE that tier is
  # nearly empty here, so the leg would pass having tested nothing.
  # -C extended runs the quick tier plus everything else.
  #
  # All four ctest_* legs below are amd64 only.  The arm64 runners are not
  # reliable enough to gate on, and an intermittent failure there costs more
  # triage than the second architecture was buying.  The matching ARCH lists in
  # .gitlab-ci.yml (the `ctest` and `ctest_quint` jobs) are amd64 only for the
  # same reason; restore the two together.  static_analysis_* keeps arm64 --
  # it builds and analyses rather than running tests, so the flakiness does not
  # reach it, and it is the only remaining arm64 compile check.
  ctest_release:
    type: run_container
    architecture: [ amd64 ]
    image: chimera-dev
    context: .
    empty_dir:
      - /build
    privileged: true
    variables:
      CTEST_FILTER: ""
    commands:
      - cd /build
      - export LC_ALL=C
      # Ring depth for the io_uring event core.  libevpl's 8192-entry default
      # costs roughly 1.5 MB of kernel-accounted memory per ring (SQE128/CQE32
      # double both entry sizes) and SQPOLL adds a kernel thread each; ctest
      # -j 12 runs many multi-threaded chimera processes at once, enough for
      # the kernel to refuse a ring with ENOMEM -- fatal to that process, so an
      # unrelated test dies with it.  Size the ring to a test rather than to a
      # server, as upstream CI does (6d360ede).  libevpl honours the value or
      # fails the ring; it never shrinks it silently.  Set on every leg that
      # runs chimera under ctest or smbtorture in this container, not on the
      # build or analysis legs, which start no rings.
      - export EVPL_IO_URING_ENTRIES=1024
      - echo "CTEST_FILTER=${CTEST_FILTER}"
      - >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Release
        -DREQUIRE_NETNS_TESTS=ON
        -DKVM_TESTING=OFF
        -DSPECS_BUNDLE=NONE
        -S /context -B /build
      - ninja --quiet
      - >
        ctest -C extended --output-on-failure --test-output-size-failed 65536
        --timeout 300 -j 12 ${CTEST_FILTER}
    dependencies:
      builder:
        project: chimera
        task: chimera-dev
        tag: develop

  ctest_debug:
    type: run_container
    architecture: [ amd64 ]
    image: chimera-dev
    context: .
    empty_dir:
      - /build
    privileged: true
    variables:
      CTEST_FILTER: ""
    commands:
      - cd /build
      - export LC_ALL=C
      # io_uring ring depth, see ctest_release.
      - export EVPL_IO_URING_ENTRIES=1024
      - echo "CTEST_FILTER=${CTEST_FILTER}"
      - >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug
        -DREQUIRE_NETNS_TESTS=ON
        -DKVM_TESTING=OFF
        -DSPECS_BUNDLE=NONE
        -S /context -B /build
      - ninja --quiet
      - >
        ctest -C extended --output-on-failure --test-output-size-failed 65536
        --timeout 300 -j 12 ${CTEST_FILTER}
    dependencies:
      builder:
        project: chimera
        task: chimera-dev
        tag: develop

  # Coverage: run the suite against a clang source-based-coverage instrumented
  # build (CMAKE_BUILD_TYPE=Coverage), then merge the per-process .profraw
  # files with etc/coverage-report.sh and publish the llvm-cov text + HTML
  # report as assets.  Mirrors ctest_debug; the report is produced even when
  # tests fail (the ctest_debug/ctest_release legs are the pass/fail gate).
  ctest_coverage:
    type: run_container
    architecture: [ amd64 ]
    image: chimera-dev
    context: .
    empty_dir:
      - /build
    privileged: true
    variables:
      CTEST_FILTER: ""
    commands:
      - cd /build
      - export LC_ALL=C
      # io_uring ring depth, see ctest_release.
      - export EVPL_IO_URING_ENTRIES=1024
      - echo "CTEST_FILTER=${CTEST_FILTER}"
      - mkdir -p /build/coverage/profraw /dist
      - >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Coverage
        -DCMAKE_C_COMPILER=clang
        -DREQUIRE_NETNS_TESTS=ON
        -DKVM_TESTING=OFF
        -DSPECS_BUNDLE=NONE
        -S /context -B /build
      - ninja --quiet
      # Each test process (and any daemon it spawns) writes its own raw
      # profile via the %m/%p patterns; the path is absolute so it survives
      # the cwd changes and netns hops the tests make.
      - export LLVM_PROFILE_FILE=/build/coverage/profraw/%m-%p.profraw
      # Two ctest passes feeding the same profraw dir (one merged report).
      # pynfs re-runs the same NFS4 server code against every VFS backend, so
      # for coverage purposes one backend (memfs) is enough -- the per-backend
      # VFS code is still covered by the posix/cthon/fsx suites in the second
      # pass.  Multiple -L options are ANDed by ctest.
      - >
        ctest -C extended --output-on-failure --test-output-size-failed 65536
        --timeout 300 -j 12 -L pynfs -L memfs ${CTEST_FILTER} ||
        echo "ctest (pynfs/memfs) reported failures; continuing"
      - >
        ctest -C extended --output-on-failure --test-output-size-failed 65536
        --timeout 300 -j 12 -LE pynfs ${CTEST_FILTER} ||
        echo "ctest (non-pynfs) reported failures; continuing"
      - >
        COVERAGE_HTML=1 bash /context/etc/coverage-report.sh /build
        > /dist/coverage-report.txt 2>&1
      - cat /dist/coverage-report.txt
      - tar -C /build/coverage -czf /dist/report.tar.gz html
    dependencies:
      builder:
        project: chimera
        task: chimera-dev
        tag: develop
    assets:
      - from: /dist
        to: coverage_report

  # The quint quick tier as its own pair of MR gates.  Upstream's test tiers
  # put the quint model-based tests -- and only them -- in the default ctest
  # configuration, so this is the cheap pre-flight that gates upstream merges.
  # Unlike the extended legs above, oras stays on PATH: SpecsBundle.cmake
  # fetches the prebuilt trace corpus and the MBT replay ctests register --
  # running those replays is the point.  -L quint plus --no-tests=error make
  # a configuration that quietly loses its corpus fail loudly instead of
  # passing having tested nothing.
  #
  # REQUIRE_CTL_MBT and REQUIRE_DISKFS_MBT extend that same guarantee one
  # level down.  Both models are generated by the quint binary rather than
  # fetched -- the control-plane model from ext/specs, the diskfs stress model
  # from src/vfs/diskfs/tests/quint, which lives in this repo and so has no
  # bundle at all.  While chimera-dev carried no quint each suite removed
  # itself with a cmake STATUS line, which is exactly what these legs exist to
  # prevent: --no-tests=error cannot catch a test that was never registered.
  # The image carries quint now, so make the absence a configure error.
  ctest_quint_release:
    type: run_container
    architecture: [ amd64 ]
    image: chimera-dev
    context: .
    empty_dir:
      - /build
    privileged: true
    commands:
      - cd /build
      - export LC_ALL=C
      # io_uring ring depth, see ctest_release.
      - export EVPL_IO_URING_ENTRIES=1024
      - >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Release
        -DREQUIRE_NETNS_TESTS=ON
        -DKVM_TESTING=OFF
        -DREQUIRE_CTL_MBT=ON
        -DREQUIRE_DISKFS_MBT=ON
        -S /context -B /build
      - ninja --quiet
      - >
        ctest -L quint --no-tests=error --output-on-failure
        --test-output-size-failed 65536 --timeout 300 -j 12
    dependencies:
      builder:
        project: chimera
        task: chimera-dev
        tag: develop

  ctest_quint_debug:
    type: run_container
    architecture: [ amd64 ]
    image: chimera-dev
    context: .
    empty_dir:
      - /build
    privileged: true
    commands:
      - cd /build
      - export LC_ALL=C
      # io_uring ring depth, see ctest_release.
      - export EVPL_IO_URING_ENTRIES=1024
      - >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug
        -DREQUIRE_NETNS_TESTS=ON
        -DKVM_TESTING=OFF
        -DREQUIRE_CTL_MBT=ON
        -DREQUIRE_DISKFS_MBT=ON
        -S /context -B /build
      - ninja --quiet
      - >
        ctest -L quint --no-tests=error --output-on-failure
        --test-output-size-failed 65536 --timeout 300 -j 12
    dependencies:
      builder:
        project: chimera
        task: chimera-dev
        tag: develop

  # Quint coverage: the quint suite against a clang source-based-coverage
  # instrumented build, rendered with the upstream report scripts into the
  # same markdown that lands on upstream PRs (per-component table plus, when
  # /context/pr.diff exists, the patch-coverage section).  The gitlab job
  # writes pr.diff into the checkout before invoking qb, so it rides in with
  # the context.  Informational, like ctest_coverage: test failures are
  # swallowed (the ctest_quint_release/_debug legs are the pass/fail gate)
  # and the report is produced regardless.  RUN_URL, when set, becomes the
  # link target of the report title.
  ctest_quint_coverage:
    type: run_container
    architecture: [ amd64 ]
    image: chimera-dev
    context: .
    empty_dir:
      - /build
    privileged: true
    variables:
      RUN_URL: ""
    commands:
      - cd /build
      - export LC_ALL=C
      # io_uring ring depth, see ctest_release.
      - export EVPL_IO_URING_ENTRIES=1024
      # Ubuntu ships these versioned; the unversioned names are not always on
      # PATH, and coverage-report.sh honours the overrides.
      - export LLVM_PROFDATA="$(command -v llvm-profdata || ls /usr/lib/llvm-*/bin/llvm-profdata | tail -n1)"
      - export LLVM_COV="$(command -v llvm-cov || ls /usr/lib/llvm-*/bin/llvm-cov | tail -n1)"
      - mkdir -p /build/coverage/profraw /dist
      - >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Coverage
        -DCMAKE_C_COMPILER=clang
        -DREQUIRE_NETNS_TESTS=ON
        -DKVM_TESTING=OFF
        -DREQUIRE_CTL_MBT=ON
        -DREQUIRE_DISKFS_MBT=ON
        -S /context -B /build
      - ninja --quiet
      # Each test process (and any daemon it spawns) writes its own raw
      # profile via the %m/%p patterns; the path is absolute so it survives
      # the cwd changes and netns hops the tests make.
      - export LLVM_PROFILE_FILE=/build/coverage/profraw/%m-%p.profraw
      - >
        ctest -L quint --no-tests=error --output-on-failure
        --test-output-size-failed 65536 --timeout 600 -j 12 ||
        echo "quint suite reported failures; continuing"
      # Which changed files are worth an lcov export; an empty list makes
      # coverage-report.sh skip the export and the patch section degrades to
      # "nothing to measure".
      - ": > /tmp/pr-sources.txt"
      - >
        if [ -s /context/pr.diff ]; then
        python3 /context/scripts/ci_patch_coverage.py --sources /context/pr.diff
        > /tmp/pr-sources.txt;
        fi
      - >
        COVERAGE_JSON=/tmp/coverage-export.json
        COVERAGE_LCOV=/tmp/patch-coverage.lcov
        COVERAGE_LCOV_SOURCES=/tmp/pr-sources.txt
        COVERAGE_HTML=1
        bash /context/etc/coverage-report.sh /build
        > /dist/coverage-report.txt 2>&1
      - >
        python3 /context/scripts/ci_coverage_report.py
        /tmp/coverage-export.json /context "${RUN_URL}"
        > /dist/coverage-report.md
      # The repo/sha arguments are omitted: they build github.com blob links
      # for the uncovered lines, which have no gitlab equivalent here.
      - >
        if [ -s /context/pr.diff ]; then
        python3 /context/scripts/ci_patch_coverage.py
        /context/pr.diff /tmp/patch-coverage.lcov /context
        >> /dist/coverage-report.md;
        fi
      - cat /dist/coverage-report.md
      - tar -C /build/coverage -czf /dist/report.tar.gz html
    dependencies:
      builder:
        project: chimera
        task: chimera-dev
        tag: develop
    assets:
      - from: /dist
        to: quint_coverage_report

  # smbtorture_explore: the FULL smbtorture matrix as a measurement, not a gate.
  # The ctest legs only ever run the enabled baseline -- add_smbtorture_backend_
  # tests() registers a ctest only for subtests listed in SMBTORTURE_ENABLED_
  # <backend> -- so the currently-failing cells are not ctests at all and CI
  # retains nothing about them.  This leg runs every (backend, subtest) cell via
  # tools/smbtorture/regen.sh --report-only and publishes results.txt, a
  # baseline-drift report, and one log per non-passing cell, so the gap between
  # the gate and the catalog is a downloadable artifact instead of something a
  # human has to reproduce locally.
  #
  # Informational, like ctest_coverage: regen.sh's exit status is swallowed and
  # `compare` runs without --fail-on-newly-failing, so a red cell never fails the
  # leg (ctest_debug/ctest_release remain the pass/fail gate).  It is also far too
  # expensive for an MR -- ~3900 cells, each with a 300s ceiling -- so the gitlab
  # job runs it only on a dedicated schedule (see .gitlab-ci.yml rules_explore).
  #
  # Retrieve the results with:
  #   qb assets download --strip -p chimera -t <QB_TAG> \
  #       --asset-name smbtorture_explore/amd64/results.tar.gz --output-dir .
  #
  # Scope a narrow investigation instead of paying for the whole matrix with:
  #   qb -V SMBTORTURE_BACKENDS=memfs -V SMBTORTURE_FILTER='smb2\.streams' \
  #       smbtorture_explore
  #
  # NEVER commit a regen of the generated block in
  # src/server/smb/tests/CMakeLists.txt from the gitlab side.  Both forks track
  # ubuntu 26.04 / samba 4.23, so the catalog and the ENABLED_* lists agree
  # exactly; a gitlab-side regen that diffs SMBTORTURE_SUITES or
  # SMBTORTURE_ENABLED_<upstream backend> is a signal to push the change upstream
  # -- or a symptom of Samba drift between builders/dev/Dockerfile and upstream's
  # .devcontainer/Dockerfile -- not something to land locally.  This leg passes
  # --report-only, which leaves CMakeLists.txt untouched.
  smbtorture_explore:
    type: run_container
    architecture: [ amd64 ]
    image: chimera-dev
    context: .
    empty_dir:
      - /build
    privileged: true
    variables:
      SMBTORTURE_BACKENDS: ""
      SMBTORTURE_FILTER: ""
      SMBTORTURE_PARALLEL: ""
    commands:
      - cd /build
      - export LC_ALL=C
      # io_uring ring depth, see ctest_release.
      - export EVPL_IO_URING_ENTRIES=1024
      # regen.sh reads these as env fallbacks (SMBTORTURE_BACKENDS /
      # SMBTORTURE_FILTER / SMBTORTURE_PARALLEL), each via ${VAR:-default}, so an
      # empty value means "the documented default": the whole backend list, no
      # filter, parallel=12.  Unlike the CTEST_FILTER convention (where the value
      # is pasted unquoted onto a ctest command line and the CALLER has to
      # single-quote any shell metacharacter), the quotes live here -- so a filter
      # regex containing ( or | is inert no matter how it was passed to qb.
      - export SMBTORTURE_BACKENDS='${SMBTORTURE_BACKENDS}'
      - export SMBTORTURE_FILTER='${SMBTORTURE_FILTER}'
      - export SMBTORTURE_PARALLEL='${SMBTORTURE_PARALLEL}'
      - echo "SMBTORTURE_BACKENDS=${SMBTORTURE_BACKENDS} SMBTORTURE_FILTER=${SMBTORTURE_FILTER} SMBTORTURE_PARALLEL=${SMBTORTURE_PARALLEL}"
      - mkdir -p /dist /out
      # REQUIRE_NETNS_TESTS doubles as an assertion that this container is
      # privileged enough for the netns wrapper every cell runs through.
      - >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Release
        -DREQUIRE_NETNS_TESTS=ON
        -DKVM_TESTING=OFF
        -S /context -B /build
      # regen.sh drives the smbtorture_test binary directly rather than ctest, so
      # the driver is the only target the matrix needs.
      - ninja --quiet smbtorture_test
      # Absolute path on purpose: regen.sh derives the repo root from $0 and cds
      # there.  --build-dir is mandatory here -- its own probe looks for
      # build/Release and /build/Release, but this task configures with -B /build,
      # so the binary is at /build/src/server/smb/tests/smbtorture_test.
      - >
        /context/tools/smbtorture/regen.sh --report-only
        --build-dir /build --out-dir /out ||
        echo "regen.sh reported failures; continuing"
      # --subs makes the catalog this run actually covered the denominator,
      # instead of the SMBTORTURE_SUITES checked into CMakeLists.txt.  regen.sh
      # writes measured-catalog.txt on every run, scoped or not, so the file is
      # always there.  Two reasons it matters: a SMBTORTURE_FILTER/BACKENDS run
      # otherwise reports "15/551 cells measured" against the whole catalog, and
      # -- the real one -- a subtest the container's smbtorture lists but the
      # checked-in catalog lacks is invisible without it, since compare only
      # walks the catalog.  That is exactly the Samba drift this leg is here to
      # surface.
      - >
        python3 /context/tools/smbtorture/regen.py compare
        --results /out/results.txt
        --subs /out/measured-catalog.txt
        --cmake /context/src/server/smb/tests/CMakeLists.txt
        > /dist/smbtorture-report.txt 2>&1 ||
        echo "regen.py compare reported drift; continuing"
      - cat /dist/smbtorture-report.txt
      # /out holds one smbt-fail.<backend>.<subtest>.log per non-passing cell --
      # hundreds of files, and everything under the assets dir is published
      # individually.  So publish three named artifacts instead: the raw
      # classifications, the drift report, and a tarball of the whole run.
      - cp /out/results.txt /dist/results.txt
      - tar -C /out -czf /dist/results.tar.gz .
    dependencies:
      builder:
        project: chimera
        task: chimera-dev
        tag: develop
    assets:
      - from: /dist
        to: smbtorture_explore

  ctest_kvm:
    type: run_container
    architecture: [ amd64 ]
    image: chimera-dev
    context: .
    empty_dir:
      - /build
    privileged: true
    variables:
      # Defaults to the gate the .gitlab-ci.yml legs apply, so that `qb ... check`
      # and ad-hoc runs agree with what the pipeline actually gates on.  With an
      # empty default this task always failed the two nfstest_alloc_diskfs_*_nfs4.2
      # tests, whatever was being tested, because nothing overrides KVM_FILTER in
      # the check alias -- which made a genuinely broken tree look exactly like a
      # clean one to the verification command the sync workflow documents.  Every
      # .gitlab-ci.yml leg passes its own value and is unaffected.  Revert this
      # together with the -E in .gitlab-ci.yml when the ENOSPC-boundary defect
      # behind it is fixed.
      #
      # The regex is single-quoted INSIDE the value: qb pastes the variable into
      # the ctest command line textually, so an unquoted ( or | is a shell syntax
      # error.  The flag and the regex stay outside the quotes so they split into
      # two ctest arguments.
      KVM_FILTER: "-E 'nfstest_alloc_diskfs'"
      MODE: "Debug"
      PLATFORM: "ubuntu2604"
      # The shard set the KVM legs are expected to cover, as "<image>" and
      # "<image>-nfstest" names.  This is the one place the list lives; the
      # ctest_kvm and ctest_kvm_images matrices in .gitlab-ci.yml must agree with
      # it, and verify_kvm_shards.sh below fails the leg when it stops covering
      # what the tree is configured to test.  Set it empty to skip the check.
      KVM_SHARDS: "ubuntu2204_hwe ubuntu2404 ubuntu2404-nfstest ubuntu2404_hwe ubuntu2604 ubuntu2604-nfstest"
    commands:
      - cd /build
      - export LC_ALL=C
      - echo "KVM_FILTER=${KVM_FILTER}"
      - echo "MODE=${MODE}"
      - echo "PLATFORM=${PLATFORM}"
      - echo "KVM_SHARDS=${KVM_SHARDS}"
      # Fail fast if the runner has no KVM device: the guests cannot boot with
      # acceleration without /dev/kvm, so there is no point building chimera and
      # fetching the (~GB) image first.
      - '[ -w /dev/kvm ] || { echo "ERROR: /dev/kvm not present -- this runner has no KVM passthrough"; exit 1; }'
      # oras (used by kvm/fetch_vm_image.sh to pull the VM images from the
      # internal registry) comes from the chimera-dev image -- see
      # builders/dev/Dockerfile.  It used to be curl'd from github.com here, but
      # this pod has no egress to github, so the download returned a block page
      # that tar reported as "not in gzip format" and every KVM leg died in 30s
      # before building anything.  Do not reintroduce a runtime fetch: nothing in
      # this task should need an external host, since the images themselves live
      # on repository.mdh.quantum.com.  A missing oras is caught by cmake below
      # (KVM_TESTING=ON makes it a configure-time FATAL_ERROR naming the tool).
      - >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=${MODE}
        -DREQUIRE_NETNS_TESTS=ON
        -DKVM_IMAGE_REGISTRY=repository.mdh.quantum.com:5009/chimera-nas/kvm-test-base
        -DKVM_TESTING=ON
        -DKVM_FETCH_IMAGES=OFF
        -S /context -B /build
      # Before the build and before the ~3.4 GB image pull, so a stale matrix
      # costs seconds.  There is no catch-all shard: an image with no shard runs
      # nowhere and fails nothing, which is the one failure mode sharding by
      # image introduces and the only one ctest cannot report.
      - '[ -z "${KVM_SHARDS}" ] || /context/qtm_build/verify_kvm_shards.sh /build "${KVM_SHARDS}"'
      - ninja --quiet
      - ninja kvm_${PLATFORM}_image
      # KVM_FILTER carries the full ctest selector for this leg, e.g.
      # "-E '/(nfstest|ltp)/'" or "-R '/(nfstest|ltp)/' -E 'nfstest_alloc_diskfs'".
      # qb substitutes it into this line textually, so the regex must be
      # single-quoted within the value (an unquoted ( or | is a shell syntax
      # error).  The ${KVM_FILTER} token here stays UNQUOTED so the flag and regex
      # split into separate args; setting it empty runs every kvm test for the
      # platform, including the ones the pipeline gates out.
      # --no-tests=error: every shard names a real guest image, so selecting
      # nothing is a defect, not an empty slice.  Without it a shard whose label
      # or path regex stopped matching would exit 0 having run nothing -- the
      # same silent loss of coverage the KVM_SHARDS check above exists to
      # prevent, one level down.  (Upstream tolerates empty shards because its
      # category list includes arch-excluded and complement categories that can
      # legitimately select nothing; ours cannot.)
      - ctest -C extended --output-on-failure --no-tests=error -L kvm -L "^${PLATFORM}$" ${KVM_FILTER} -j 12
    dependencies:
      builder:
        project: chimera
        task: chimera-dev
        tag: develop

  static_analysis_release:
    type: run_container
    architecture: [ amd64, arm64 ]
    image: chimera-dev
    context: .
    empty_dir:
      - /build
    commands:
      - cd /context
      - export LC_ALL=C
      - >
        scan-build --status-bugs
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -D IO_URING_NVME_ENABLED=OFF -S . -B /build
      - scan-build --status-bugs ninja -C /build
    dependencies:
      builder:
        project: chimera
        task: chimera-dev
        tag: develop

  static_analysis_release_report:
    type: run_container
    architecture: [ amd64, arm64 ]
    image: chimera-dev
    context: .
    empty_dir:
      - /build
    commands:
      - cd /context
      - mkdir -p /scan-report /dist
      - export LC_ALL=C
      - >
        scan-build -o /scan-report
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -D IO_URING_NVME_ENABLED=OFF -S . -B /build
      - >
        scan-build --keep-empty -o /scan-report ninja -C /build 2>&1 |
        tee /dist/scan-build-output.txt
      - mv /scan-report/* /tmp/analysis
      - tar -C /tmp -czf /dist/report.tar.gz analysis
      - num_bugs=$(grep -i "bugs* found" /dist/scan-build-output.txt | tr -d -c 0-9)
      - echo "$num_bugs" > /dist/num_bugs
    dependencies:
      builder:
        project: chimera
        task: chimera-dev
        tag: develop
    assets:
      - from: /dist
        to: release/scan-report

  static_analysis_debug:
    type: run_container
    architecture: [ amd64, arm64 ]
    image: chimera-dev
    context: .
    empty_dir:
      - /build
    commands:
      - cd /context
      - export LC_ALL=C
      - >
        scan-build --status-bugs
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug -D IO_URING_NVME_ENABLED=OFF -S . -B /build
      - scan-build --status-bugs ninja -C /build
    dependencies:
      builder:
        project: chimera
        task: chimera-dev
        tag: develop

  static_analysis_debug_report:
    type: run_container
    architecture: [ amd64, arm64 ]
    image: chimera-dev
    context: .
    empty_dir:
      - /build
    commands:
      - cd /context
      - mkdir -p /scan-report /dist
      - export LC_ALL=C
      - >
        scan-build -o /scan-report
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug -D IO_URING_NVME_ENABLED=OFF -S . -B /build
      - >
        scan-build --keep-empty -o /scan-report ninja -C /build 2>&1 |
        tee /dist/scan-build-output.txt
      - mv /scan-report/* /tmp/analysis
      - tar -C /tmp -czf /dist/report.tar.gz analysis
      - num_bugs=$(grep -i "bugs* found" /dist/scan-build-output.txt | tr -d -c 0-9)
      - echo "$num_bugs" > /dist/num_bugs
    dependencies:
      builder:
        project: chimera
        task: chimera-dev
        tag: develop
    assets:
      - from: /dist
        to: debug/scan-report

# Alias section
aliases:
  builders:
    - builder_Ubuntu22
    - builder_Ubuntu24
    - builder_Ubuntu26
    - builder_Rocky9
  build:
    - build_debug_Ubuntu22
    - build_release_Ubuntu22
    - build_debug_Ubuntu24
    - build_release_Ubuntu24
    - build_debug_Ubuntu26
    - build_release_Ubuntu26
    - build_debug_Rocky9
    - build_release_Rocky9
  ubuntu22:
    - builder_Ubuntu22
    - build_debug_Ubuntu22
    - build_release_Ubuntu22
  ubuntu24:
    - builder_Ubuntu24
    - build_debug_Ubuntu24
    - build_release_Ubuntu24
  ubuntu26:
    - builder_Ubuntu26
    - build_debug_Ubuntu26
    - build_release_Ubuntu26
  rocky9:
    - builder_Rocky9
    - build_debug_Rocky9
    - build_release_Rocky9
  check:
    - chimera-dev
    - ctest_debug
    - ctest_release
    - ctest_quint_debug
    - ctest_quint_release
