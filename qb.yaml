project: chimera
default_builder_tag: develop
variables:
  VERSION: 0.0.0
  REVISION: 1

tasks:
  # Ubuntu22.04 Section
  # ---------------------------------------
  builder_Ubuntu22:
    type: build_container
    architecture: [ amd64, arm64 ]
    dockerfile: builders/Ubuntu22/Dockerfile
    registry_path: builder_ubuntu22
    context: builders/Ubuntu22
    dependencies:
      uncrustify:
        project: uncrustify
        task: build_Ubuntu22
        tag: 0.78.1-quantum

  build_debug_Ubuntu22:
    type: run_container
    architecture: [ amd64, arm64 ]
    image: builder_ubuntu22
    context: .
    commands:
      - export DESTDIR=/build/quantum-chimera-server_${VERSION}-${REVISION}_$arch
      - mkdir -p ${DESTDIR} /dist
      - >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug
        -DIO_URING_ENABLED=OFF
        -DCAIRN_ENABLED=OFF
        -DCMAKE_INSTALL_PREFIX=/opt/quantum/chimera
        -B /build -S /context
      - ninja -C /build
      - ninja -C /build install
      - /context/qtm_build/verify_test_includes.sh ${DESTDIR}/opt/quantum/chimera
      - cd ${DESTDIR}
      - tar cfz /dist/chimera.tar.gz .
      - /context/qtm_build/make_debian_pkg.sh ${VERSION} ${REVISION} $arch
    assets:
      - from: /dist
        to: debug/Ubuntu22
    dependencies:
      builder:
        project: chimera
        task: builder_Ubuntu22
        tag: develop

  build_release_Ubuntu22:
    type: run_container
