project: chimera
variables:
  VERSION: 0.0.0
  REVISION: 1

tasks:
  # Ubuntu22.04 Section
  # ---------------------------------------
  builder_Ubuntu22:
    type: build_container
    architecture: [ amd64, arm64 ]
    dockerfile: builders/Ubuntu22/Dockerfile
    registry_path: builder_ubuntu22
    context: builders/Ubuntu22
    dependencies:
      uncrustify:
        project: uncrustify
        task: build_Ubuntu22
        tag: 0.78.1-quantum

  build_debug_Ubuntu22:
    type: run_container
    architecture: [ amd64, arm64 ]
    variables:
      BUILD_TYPE: Debug
      ASSET_DST: debug/Ubuntu22
    image: builder_ubuntu22
    context: .
    commands:
      - export DESTDIR=/build/quantum-chimera-server_${VERSION}-${REVISION}_$arch
      - mkdir -p ${DESTDIR} /dist
      - >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
        -DDISABLE_TESTS=ON
        -DIO_URING_ENABLED=OFF
        -DCAIRN_ENABLED=OFF
        -DCMAKE_INSTALL_PREFIX=/opt/quantum/chimera
        -B /build -S /context
      - ninja -C /build
      - ninja -C /build install
      - cd ${DESTDIR}
      - tar cfz /dist/chimera.tar.gz .
      - /context/qtm_build/make_debian_pkg.sh ${VERSION} ${REVISION} $arch
    assets:
      - from: /dist
        to: ${ASSET_DST}
    dependencies:
      builder:
        project: chimera
        task: builder_Ubuntu22
        tag: develop

  build_release_Ubuntu22:
    type: run_container
    variables:
      BUILD_TYPE: Release
      ASSET_DST: release/Ubuntu22
    architecture: [ amd64, arm64 ]
    image: builder_ubuntu22
    context: .
    commands:
      - export DESTDIR=/build/quantum-chimera-server_${VERSION}-${REVISION}_$arch
      - mkdir -p ${DESTDIR} /dist
      - >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
        -DDISABLE_TESTS=ON
        -DIO_URING_ENABLED=OFF
        -DCAIRN_ENABLED=OFF
        -DCMAKE_INSTALL_PREFIX=/opt/quantum/chimera
        -B /build -S /context
      - ninja -C /build
      - ninja -C /build install
      - cd ${DESTDIR}
      - tar cfz /dist/chimera.tar.gz .
      - /context/qtm_build/make_debian_pkg.sh ${VERSION} ${REVISION} $arch
    assets:
      - from: /dist
        to: ${ASSET_DST}
    dependencies:
      builder:
        project: chimera
        task: builder_Ubuntu22
        tag: develop

  # Ubuntu 24.04 section
  # ---------------------------------------
  builder_Ubuntu24:
    type: build_container
    architecture: [ amd64, arm64 ]
    dockerfile: builders/Ubuntu24/Dockerfile
    registry_path: builder_ubuntu24
    context: builders/Ubuntu24
    dependencies:
      uncrustify:
        project: uncrustify
        task: build_Ubuntu22
        tag: 0.78.1-quantum

  build_debug_Ubuntu24:
    type: run_container
    architecture: [ amd64, arm64 ]
    variables:
      BUILD_TYPE: Debug
      ASSET_DST: debug/Ubuntu24
    image: builder_ubuntu24
    context: .
    commands:
      - export DESTDIR=/build/quantum-chimera-server_${VERSION}-${REVISION}_$arch
      - mkdir -p ${DESTDIR} /dist
      - >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
        -DDISABLE_TESTS=ON
        -DIO_URING_ENABLED=OFF
        -DCAIRN_ENABLED=OFF
        -DCMAKE_INSTALL_PREFIX=/opt/quantum/chimera
        -B /build -S /context
      - ninja -C /build
      - ninja -C /build install
      - cd ${DESTDIR}
      - tar cfz /dist/chimera.tar.gz .
      - /context/qtm_build/make_debian_pkg.sh ${VERSION} ${REVISION} $arch
    assets:
      - from: /dist
        to: ${ASSET_DST}
    dependencies:
      builder:
        project: chimera
        task: builder_Ubuntu24
        tag: develop

  build_release_Ubuntu24:
    type: run_container
    architecture: [ amd64, arm64 ]
    variables:
      BUILD_TYPE: Release
      ASSET_DST: release/Ubuntu24
    image: builder_ubuntu24
    context: .
    commands:
      - export DESTDIR=/build/quantum-chimera-server_${VERSION}-${REVISION}_$arch
      - mkdir -p ${DESTDIR} /dist
      - >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
        -DDISABLE_TESTS=ON
        -DIO_URING_ENABLED=OFF
        -DCAIRN_ENABLED=OFF
        -DCMAKE_INSTALL_PREFIX=/opt/quantum/chimera
        -B /build -S /context
      - ninja -C /build
      - ninja -C /build install
      - cd ${DESTDIR}
      - tar cfz /dist/chimera.tar.gz .
      - /context/qtm_build/make_debian_pkg.sh ${VERSION} ${REVISION} $arch
    assets:
      - from: /dist
        to: ${ASSET_DST}
    dependencies:
      builder:
        project: chimera
        task: builder_Ubuntu24
        tag: develop

  # Rocky9 section
  # ---------------------------------------
  builder_Rocky9:
    type: build_container
    architecture: [ amd64 ]
    dockerfile: builders/Rocky9/Dockerfile
    registry_path: builder_rocky9
    context: builders/Rocky9
    dependencies:
      uncrustify:
        project: uncrustify
        task: build_Rocky9
        tag: 0.78.1-quantum

  build_debug_Rocky9:
    type: run_container
    architecture: [ amd64 ]
    variables:
      BUILD_TYPE: Debug
      ASSET_DST: debug/Rocky9
    image: builder_rocky9
    context: .
    dependencies:
      builder:
        project: chimera
        task: builder_Rocky9
        tag: develop
    commands:
      - export DESTDIR=/build/root
      - mkdir -p ${DESTDIR} /dist
      - >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
        -DDISABLE_TESTS=ON
        -DIO_URING_ENABLED=OFF
        -DCAIRN_ENABLED=OFF
        -DCMAKE_INSTALL_PREFIX=/opt/quantum/chimera
        -B /build -S /context
      - ninja -C /build
      - ninja -C /build install
      - cd ${DESTDIR}
      - tar cfz /dist/chimera.tar.gz .
      - /context/qtm_build/make_rpm_pkg.sh ${VERSION} ${REVISION} $xarch
    assets:
      - from: /dist
        to: ${ASSET_DST}

  build_release_Rocky9:
    type: run_container
    architecture: [ amd64 ]
    variables:
      BUILD_TYPE: Release
      ASSET_DST: release/Rocky9
    image: builder_rocky9
    context: .
    dependencies:
      builder:
        project: chimera
        task: builder_Rocky9
        tag: develop
    commands:
      - export DESTDIR=/build/root
      - mkdir -p ${DESTDIR} /dist
      - >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
        -DDISABLE_TESTS=ON
        -DIO_URING_ENABLED=OFF
        -DCAIRN_ENABLED=OFF
        -DCMAKE_INSTALL_PREFIX=/opt/quantum/chimera
        -B /build -S /context
      - ninja -C /build
      - ninja -C /build install
      - cd ${DESTDIR}
      - tar cfz /dist/chimera.tar.gz .
      - /context/qtm_build/make_rpm_pkg.sh ${VERSION} ${REVISION} $xarch
    assets:
      - from: /dist
        to: ${ASSET_DST}

  # Code check
  # ---------------------------------------
  # Chimera-dev container
  chimera-dev:
    type: build_container
    architecture: [ amd64, arm64 ]
    dockerfile: .devcontainer/Dockerfile
    registry_path: chimera-dev
    context: .devcontainer/
    build_args:
      DOCKER_MIRROR: repository.mdh.quantum.com/
      APT_MIRROR: http://repository.mdh.quantum.com/repository/pkgs/ubuntu

  syntax:
    type: run_container
    image: chimera-dev
    context: .
    commands:
      - cd /context
      - make syntax-check < /dev/null
    dependencies:
      builder:
        project: chimera
        task: chimera-dev
        tag: develop

  ctest_release:
    type: run_container
    architecture: [ amd64, arm64 ]
    image: chimera-dev
    context: .
    empty_dir:
      - /build
    privileged: true
    commands:
      - cd /context
      - make test_release < /dev/null
    dependencies:
      builder:
        project: chimera
        task: chimera-dev
        tag: develop

  ctest_debug:
    type: run_container
    architecture: [ amd64, arm64 ]
    image: chimera-dev
    context: .
    empty_dir:
      - /build
    privileged: true
    commands:
      - cd /context
      - make test_debug < /dev/null
    dependencies:
      builder:
        project: chimera
        task: chimera-dev
        tag: develop

  static_analysis_release:
    type: run_container
    architecture: [ amd64, arm64 ]
    image: chimera-dev
    context: .
    commands:
      - cd /context
      - make build_clang_release < /dev/null
    dependencies:
      builder:
        project: chimera
        task: chimera-dev
        tag: develop

  static_analysis_debug:
    type: run_container
    architecture: [ amd64, arm64 ]
    image: chimera-dev
    context: .
    commands:
      - cd /context
      - make build_clang_debug < /dev/null
    dependencies:
      builder:
        project: chimera
        task: chimera-dev
        tag: develop


# Alias section
aliases:
  builders:
    - builder_Ubuntu22
    - builder_Ubuntu24
    - builder_Rocky9
  build:
    - build_debug_Ubuntu22
    - build_release_Ubuntu22
    - build_debug_Ubuntu24
    - build_release_Ubuntu24
    - build_debug_Rocky9
    - build_release_Rocky9
  ubuntu22:
    - builder_Ubuntu22
    - build_debug_Ubuntu22
    - build_release_Ubuntu22
  ubuntu24:
    - builder_Ubuntu24
    - build_debug_Ubuntu24
    - build_release_Ubuntu24
  rocky9:
    - builder_Rocky9
    - build_debug_Rocky9
    - build_release_Rocky9
  check:
    - chimera-dev
    - ctest_debug
    - ctest_release
    - static_analysis_debug
    - static_analysis_release
    - syntax
  chimera:
    - builders
    - build
    - check
