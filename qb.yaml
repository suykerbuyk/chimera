  # Code check
  # ---------------------------------------
  # Chimera-dev container
  chimera-dev:
    type: build_container
    architecture: [ amd64, arm64 ]
    dockerfile: builders/dev/Dockerfile
    registry_path: chimera-dev
    context: builders/dev

  syntax:
    type: run_container
    image: chimera-dev
    context: .
    commands:
      - cd /context
      - make syntax-check < /dev/null
      - export BASE=origin/develop
      - make copyright-check <  /dev/null
    dependencies:
      builder:
        project: chimera
        task: chimera-dev
        tag: develop

  # The ctest suites are split into two tasks each -- the pynfs label (the bulk
  # of the runtime) and everything else (`-LE pynfs`) -- so they run as separate
  # parallel CI jobs. Each task still configures and builds independently because
  # qb tasks run in isolated containers with their own empty /build.
  ctest_release_pynfs:
    type: run_container
    architecture: [ amd64, arm64 ]
    image: chimera-dev
    context: .
    empty_dir:
      - /build
    privileged: true
    commands:
      - cd /build
      - >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Release
        -DREQUIRE_NETNS_TESTS=ON
        -DKVM_TESTING=OFF
        -S /context -B /build
      - ninja --quiet
      - ctest --output-on-failure --test-output-size-failed 65536 --timeout 300 -j 12 -L pynfs -E diskfs_
    dependencies:
      builder:
        project: chimera
        task: chimera-dev
        tag: develop

  ctest_release_other:
    type: run_container
    architecture: [ amd64, arm64 ]
    image: chimera-dev
    context: .
    empty_dir:
      - /build
    privileged: true
    commands:
      - cd /build
      - >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Release
        -DREQUIRE_NETNS_TESTS=ON
        -DKVM_TESTING=OFF
        -S /context -B /build
      - ninja --quiet
      - ctest --output-on-failure --test-output-size-failed 65536 --timeout 300 -j 12 -LE pynfs
    dependencies:
      builder:
        project: chimera
        task: chimera-dev
        tag: develop

  ctest_debug_pynfs:
