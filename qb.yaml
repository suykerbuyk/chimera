    - chimera-dev
    - ctest_coverage
  quint:
    - chimera-dev
    - ctest_quint_debug
    - ctest_quint_release
    - ctest_quint_coverage
  smbtorture:
    - chimera-dev
    - smbtorture_explore
  chimera:
    - builders
    - build
