project: chimera
tasks:
  # Ubuntu22.04 Section
  # ---------------------------------------
  builder_Ubuntu22:
    type: build_container
    architecture: [ amd64, arm64 ]
    dockerfile: builders/Ubuntu22/Dockerfile
    registry_path: builder_ubuntu22
    context: builders/Ubuntu22
    dependencies:
      uncrustify:
        project: uncrustify
        task: build_Ubuntu22
        tag: 0.78.1-quantum

  build_debug_Ubuntu22:
    type: run_container
    architecture: [ amd64, arm64 ]
    variables:
      BUILD_TYPE: Debug
      ASSET_DST: debug/Ubuntu22
    image: builder_ubuntu22
    context: .
    commands:
      - mkdir -p /build /dist
      - cd /build
      - >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
        -DDISABLE_TESTS=ON
        -DIO_URING_ENABLED=OFF
        -DCAIRN_ENABLED=OFF
        -DCMAKE_INSTALL_PREFIX=/opt/quantum/chimera
        -B /build -S /context
      - ninja -C /build
      - ninja -C /build install
      - tar cfz /dist/chimera.tar.gz /opt/quantum/chimera
    assets:
      - from: /dist
        to: ${ASSET_DST}
    dependencies:
      builder:
        project: chimera
        task: builder_Ubuntu22
        tag: main-quantum

  build_release_Ubuntu22:
    type: run_container
    variables:
      BUILD_TYPE: Release
      ASSET_DST: release/Ubuntu22
    architecture: [ amd64, arm64 ]
    image: builder_ubuntu22
    context: .
    commands:
      - mkdir -p /build /dist
      - cd /build
      - >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
        -DDISABLE_TESTS=ON
        -DIO_URING_ENABLED=OFF
        -DCAIRN_ENABLED=OFF
        -DCMAKE_INSTALL_PREFIX=/opt/quantum/chimera
        -B /build -S /context
      - ninja -C /build
      - ninja -C /build install
      - tar cfz /dist/chimera.tar.gz /opt/quantum/chimera
    assets:
      - from: /dist
        to: ${ASSET_DST}
    dependencies:
      builder:
        project: chimera
        task: builder_Ubuntu22
        tag: main-quantum

  syntax_Ubuntu22:
    type: run_container
    image: builder_ubuntu22
    context: .
    commands:
      - cd /context
      - make syntax-check < /dev/null
    dependencies:
      builder:
        project: chimera
        task: builder_Ubuntu22
        tag: main-quantum

  # Ubuntu 24.04 section
  # TODO: why is ARM64 build failing?
  # ---------------------------------------
  builder_Ubuntu24:
    type: build_container
    architecture: [ amd64, arm64 ]
    dockerfile: builders/Ubuntu24/Dockerfile
    registry_path: builder_ubuntu24
    context: builders/Ubuntu24
    dependencies:
      uncrustify:
        project: uncrustify
        task: build_Ubuntu22
        tag: 0.78.1-quantum

  build_debug_Ubuntu24:
    type: run_container
    architecture: [ amd64, arm64 ]
    variables:
      BUILD_TYPE: Debug
      ASSET_DST: debug/Ubuntu24
    image: builder_ubuntu24
    context: .
    commands:
      - mkdir -p /build /dist
      - cd /build
      - >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
        -DDISABLE_TESTS=ON
        -DIO_URING_ENABLED=OFF
        -DCAIRN_ENABLED=OFF
        -DCMAKE_INSTALL_PREFIX=/opt/quantum/chimera
        -B /build -S /context
      - ninja -C /build
      - ninja -C /build install
      - tar cfz /dist/chimera.tar.gz /opt/quantum/chimera
    assets:
      - from: /dist
        to: ${ASSET_DST}
    dependencies:
      builder:
        project: chimera
        task: builder_Ubuntu24
        tag: main-quantum

  build_release_Ubuntu24:
    type: run_container
    architecture: [ amd64, arm64 ]
    variables:
      BUILD_TYPE: Release
      ASSET_DST: release/Ubuntu24
    image: builder_ubuntu24
    context: .
    commands:
      - mkdir -p /build /dist
      - cd /build
      - >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
        -DDISABLE_TESTS=ON
        -DIO_URING_ENABLED=OFF
        -DCAIRN_ENABLED=OFF
        -DCMAKE_INSTALL_PREFIX=/opt/quantum/chimera
        -B /build -S /context
      - ninja -C /build
      - ninja -C /build install
      - tar cfz /dist/chimera.tar.gz /opt/quantum/chimera
    assets:
      - from: /dist
        to: ${ASSET_DST}
    dependencies:
      builder:
        project: chimera
        task: builder_Ubuntu24
        tag: main-quantum

  syntax_Ubuntu24:
    type: run_container
    image: builder_ubuntu24
    context: .
    commands:
      - cd /context
      - make syntax-check < /dev/null
    dependencies:
      builder:
        project: chimera
        task: builder_Ubuntu24
        tag: main-quantum

  # Rocky9 section
  # ---------------------------------------
  builder_Rocky9:
    type: build_container
    architecture: [ amd64 ]
    dockerfile: builders/Rocky9/Dockerfile
    registry_path: builder_rocky9
    context: builders/Rocky9

  build_debug_Rocky9:
    type: run_container
    architecture: [ amd64 ]
    variables:
      BUILD_TYPE: Debug
      ASSET_DST: debug/Rocky9
    image: builder_rocky9
    context: .
    dependencies:
      builder:
        project: chimera
        task: builder_Rocky9
        tag: main-quantum
    commands:
      - mkdir -p /build /dist
      - cd /build
      - >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
        -DDISABLE_TESTS=ON
        -DIO_URING_ENABLED=OFF
        -DCAIRN_ENABLED=OFF
        -DCMAKE_INSTALL_PREFIX=/opt/quantum/chimera
        -B /build -S /context
      - ninja -C /build
      - ninja -C /build install
      - tar cfz /dist/chimera.tar.gz /opt/quantum/chimera
      - rpmdev-setuptree
      - cp /dist/chimera.tar.gz /root/rpmbuild/SOURCES
      - cp /context/etc/chimera.service /root/rpmbuild/SOURCES
      - rpmbuild -ba --with debug_build /context/scripts/chimera.spec
      # Create a repo with prereq RPM.
      - mkdir -p /repo
      - cp /root/rpmbuild/RPMS/x86_64/*.rpm /repo
      - dnf download xxhash-libs libunwind liburing --arch  x86_64 --destdir /repo
      - cd /repo
      - tar cfz /dist/repo-chimera.tar.gz .
    assets:
      - from: /dist
        to: ${ASSET_DST}

  build_release_Rocky9:
    type: run_container
    architecture: [ amd64 ]
    variables:
      BUILD_TYPE: Release
      ASSET_DST: release/Rocky9
    image: builder_rocky9
    context: .
    dependencies:
      builder:
        project: chimera
        task: builder_Rocky9
        tag: main-quantum
    commands:
      - mkdir -p /build /dist
      - cd /build
      - >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
        -DDISABLE_TESTS=ON
        -DIO_URING_ENABLED=OFF
        -DCAIRN_ENABLED=OFF
        -DCMAKE_INSTALL_PREFIX=/opt/quantum/chimera
        -B /build -S /context
      - ninja -C /build
      - ninja -C /build install
      - tar cfz /dist/chimera.tar.gz /opt/quantum/chimera
      - rpmdev-setuptree
      - cp /dist/chimera.tar.gz /root/rpmbuild/SOURCES
      - cp /context/etc/chimera.service /root/rpmbuild/SOURCES
      - rpmbuild -ba /context/scripts/chimera.spec
      # Create a repo with prereq RPM.
      - mkdir -p /repo
      - cp /root/rpmbuild/RPMS/x86_64/*.rpm /repo
      - dnf download xxhash-libs libunwind liburing --arch  x86_64 --destdir /repo
      - cd /repo
      - tar cfz /dist/repo-chimera.tar.gz .
    assets:
      - from: /dist
        to: ${ASSET_DST}

# Alias section
aliases:
  builders:
    - builder_Ubuntu22
    - builder_Ubuntu24
    - builder_Rocky9
  build:
    - build_debug_Ubuntu22
    - build_release_Ubuntu22
    - syntax_Ubuntu22
    - build_debug_Ubuntu24
    - build_release_Ubuntu24
    - syntax_Ubuntu24
    - build_debug_Rocky9
    - build_release_Rocky9
  ubuntu22:
    - builder_Ubuntu22
    - build_debug_Ubuntu22
    - build_release_Ubuntu22
  ubuntu24:
    - builder_Ubuntu24
    - build_debug_Ubuntu24
    - build_release_Ubuntu24
  rocky9:
    - builder_Rocky9
    - build_debug_Rocky9
    - build_release_Rocky9
  chimera:
    - builders
    - build
