project: chimera
tasks:
  # Ubuntu22.04 Section
  # ---------------------------------------
  builder_Ubuntu22:
    type: build_container
    architecture: [ amd64, arm64 ]
    dockerfile: builders/Ubuntu22/Dockerfile
    registry_path: builder_ubuntu22
    context: builders/Ubuntu22

  build_debug_Ubuntu22:
    type: run_container
    architecture: [ amd64, arm64 ]
    variables:
      BUILD_TYPE: Debug
      ASSET_DST: debug/Ubuntu22
    image: builder_ubuntu22
    context: .
    commands:
      - mkdir -p /build /dist
      - cd /build
      - >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
        -DDISABLE_TESTS=ON
        -DIO_URING_ENABLED=OFF
        -DCAIRN_ENABLED=OFF
        -DCMAKE_INSTALL_PREFIX=/opt/quantum/chimera
        -B /build -S /context
      - ninja -C /build
      - ninja -C /build install
      - tar cfz /dist/chimera.tar.gz /opt/quantum/chimera
    assets:
      - from: /dist
        to: ${ASSET_DST}
    dependencies:
      builder:
        project: chimera
        task: builder_Ubuntu22
        tag: main-quantum

  build_release_Ubuntu22:
    type: run_container
    variables:
      BUILD_TYPE: Release
      ASSET_DST: release/Ubuntu22
    architecture: [ amd64, arm64 ]
    image: builder_ubuntu22
    context: .
    commands:
      - mkdir -p /build /dist
      - cd /build
      - >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
        -DDISABLE_TESTS=ON
        -DIO_URING_ENABLED=OFF
        -DCAIRN_ENABLED=OFF
        -DCMAKE_INSTALL_PREFIX=/opt/quantum/chimera
        -B /build -S /context
      - ninja -C /build
      - ninja -C /build install
      - tar cfz /dist/chimera.tar.gz /opt/quantum/chimera
    assets:
      - from: /dist
        to: ${ASSET_DST}
    dependencies:
      builder:
        project: chimera
        task: builder_Ubuntu22
        tag: main-quantum

  # Ubuntu 24.04 section
  # ---------------------------------------
  builder_Ubuntu24:
    type: build_container
    architecture: [ amd64, arm64 ]
    dockerfile: builders/Ubuntu24/Dockerfile
    registry_path: builder_ubuntu24
    context: builders/Ubuntu24

  build_debug_Ubuntu24:
    type: run_container
    architecture: [ amd64, arm64 ]
    variables:
      BUILD_TYPE: Debug
      ASSET_DST: debug/Ubuntu24
    image: builder_ubuntu24
    context: .
    commands:
      - mkdir -p /build /dist
      - cd /build
      - >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
        -DDISABLE_TESTS=ON
        -DIO_URING_ENABLED=OFF
        -DCAIRN_ENABLED=OFF
        -DCMAKE_INSTALL_PREFIX=/opt/quantum/chimera
        -B /build -S /context
      - ninja -C /build
      - ninja -C /build install
      - tar cfz /dist/chimera.tar.gz /opt/quantum/chimera
    assets:
      - from: /dist
        to: ${ASSET_DST}
    dependencies:
      builder:
        project: chimera
        task: builder_Ubuntu24
        tag: main-quantum

  build_release_Ubuntu24:
    type: run_container
    architecture: [ amd64, arm64 ]
    variables:
      BUILD_TYPE: Release
      ASSET_DST: release/Ubuntu24
    image: builder_ubuntu24
    context: .
    commands:
      - mkdir -p /build /dist
      - cd /build
      - >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=${BUILD_TYPE}
        -DDISABLE_TESTS=ON
        -DIO_URING_ENABLED=OFF
        -DCAIRN_ENABLED=OFF
        -DCMAKE_INSTALL_PREFIX=/opt/quantum/chimera
        -B /build -S /context
      - ninja -C /build
      - ninja -C /build install
      - tar cfz /dist/chimera.tar.gz /opt/quantum/chimera
    assets:
      - from: /dist
        to: ${ASSET_DST}
    dependencies:
      builder:
        project: chimera
        task: builder_Ubuntu24
        tag: main-quantum

aliases:
  builders:
    - builder_Ubuntu22
    - builder_Ubuntu24
  build:
    - build_debug_Ubuntu22
    - build_release_Ubuntu22
    - build_debug_Ubuntu24
    - build_release_Ubuntu24
  ubuntu22:
    - builder_Ubuntu22
    - build_debug_Ubuntu22
    - build_release_Ubuntu22
  ubuntu24:
    - builder_Ubuntu24
    - build_debug_Ubuntu24
    - build_release_Ubuntu24
  chimera:
    - builders
    - build
