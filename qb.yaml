  # Code check
  # ---------------------------------------
  # Chimera-dev container
  chimera-dev:
    type: build_container
    architecture: [ amd64, arm64 ]
    dockerfile: builders/dev/Dockerfile
    registry_path: chimera-dev
    context: builders/dev

  syntax:
    type: run_container
    image: chimera-dev
    context: .
    commands:
      - cd /context
      - make syntax-check < /dev/null
      - export BASE=origin/develop
      - make copyright-check <  /dev/null
    dependencies:
      builder:
        project: chimera
        task: chimera-dev
        tag: develop

  # CTEST_FILTER carries the ctest selector for a CI leg (e.g. "-L pynfs -E
  # diskfs_" or "-LE pynfs") so one task serves every test group.  qb
  # substitutes it into the ctest line textually and the token stays UNQUOTED
  # so the flags and arguments split into separate args; empty (the default)
  # runs the full suite.  Each invocation still configures and builds
  # independently because qb tasks run in isolated containers with their own
  # empty /build.
  #
  # The quint MBT trace replays are disabled in the test legs until upstream
  # fixes the batch replayer hang (whenever trace stepFds_128_0x1_2 precedes
  # another trace, the reset's umount waits forever on a VFS close that never
  # completes, so chimera/posix/mbt/batch_memfs always burns its 300 s
  # timeout).  Each leg hides the oras binary before cmake runs: with no oras
  # (and no quint) SpecsBundle.cmake cannot obtain the trace corpus, so the
  # replay ctests are never registered.  The quick corpus-free *_probe quint
  # tests still run.  ctest_kvm is unaffected -- it runs in its own container
  # with its own oras.  Drop the mv lines once upstream fixes the hang.
  #
  # Every ctest below passes -C extended: upstream's test tiers (see the
  # add_test override in the top-level CMakeLists.txt) put everything except
  # the quint model-based tests in the extended tier, so a bare `ctest` here
  # would run only the quick tier -- and with oras hidden and no quint in the
  # builder image, that tier is nearly empty and the leg would pass having
  # tested nothing.  -C extended runs the quick tier plus everything else.
  ctest_release:
    type: run_container
    architecture: [ amd64, arm64 ]
    image: chimera-dev
    context: .
    empty_dir:
      - /build
    privileged: true
    variables:
      CTEST_FILTER: ""
    commands:
      - cd /build
      - export LC_ALL=C
      - echo "CTEST_FILTER=${CTEST_FILTER}"
      - echo "quint MBT trace replays disabled - hiding oras so cmake finds no trace corpus (upstream batch replayer hang)"
      - mv /usr/local/bin/oras /usr/local/bin/oras.hidden || true
      - >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Release
        -DREQUIRE_NETNS_TESTS=ON
        -DKVM_TESTING=OFF
        -S /context -B /build
      - ninja --quiet
      - >
        ctest -C extended --output-on-failure --test-output-size-failed 65536
        --timeout 300 -j 12 ${CTEST_FILTER}
    dependencies:
      builder:
        project: chimera
        task: chimera-dev
        tag: develop

  ctest_debug:
    type: run_container
    architecture: [ amd64, arm64 ]
    image: chimera-dev
    context: .
    empty_dir:
      - /build
    privileged: true
    variables:
      CTEST_FILTER: ""
    commands:
      - cd /build
      - export LC_ALL=C
      - echo "CTEST_FILTER=${CTEST_FILTER}"
      - echo "quint MBT trace replays disabled - hiding oras so cmake finds no trace corpus (upstream batch replayer hang)"
      - mv /usr/local/bin/oras /usr/local/bin/oras.hidden || true
      - >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug
        -DREQUIRE_NETNS_TESTS=ON
        -DKVM_TESTING=OFF
        -S /context -B /build
