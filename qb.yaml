project: chimera
default_builder_tag: develop
# No VERSION/REVISION here on purpose.  The package version is derived from the
# nearest reachable <X.Y.Z>-myriad* git tag by qtm_build/pkg_version.sh, which
# every packaging task sources as its first command; a default here would be a
# stale 0.0.0-1 that silently wins whenever the tag lookup is the thing that
# broke.  To force a version, pass `-V VERSION=X.Y.Z [-V REVISION=r]` -- qb
# exports every manifest variable into the build container as QB_<NAME>, and
# pkg_version.sh honours QB_VERSION / QB_REVISION.

tasks:
  # Ubuntu22.04 Section
  # ---------------------------------------
  builder_Ubuntu22:
    type: build_container
    architecture: [ amd64, arm64 ]
    dockerfile: builders/Ubuntu22/Dockerfile
    registry_path: builder_ubuntu22
    context: builders/Ubuntu22
    dependencies:
      uncrustify:
        project: uncrustify
        task: build_Ubuntu22
        tag: 0.78.1-quantum

  build_debug_Ubuntu22:
    type: run_container
    architecture: [ amd64, arm64 ]
    image: builder_ubuntu22
    context: .
    commands:
      - . /context/qtm_build/pkg_version.sh
      - export DESTDIR=/build/quantum-chimera-server_${PKG_VERSION}-${PKG_REVISION}_$arch
      - mkdir -p ${DESTDIR} /dist
      - >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug
        -DIO_URING_ENABLED=OFF
        -DCAIRN_ENABLED=OFF
        -DCMAKE_INSTALL_PREFIX=/opt/quantum/chimera
        -B /build -S /context
      - ninja -C /build
      - ninja -C /build install
      - /context/qtm_build/verify_test_includes.sh ${DESTDIR}/opt/quantum/chimera
      - cd ${DESTDIR}
      - tar cfz /dist/chimera.tar.gz .
      - /context/qtm_build/make_debian_pkg.sh "${PKG_VERSION}" "${PKG_REVISION}" $arch
    assets:
      - from: /dist
        to: debug/Ubuntu22
    dependencies:
      builder:
