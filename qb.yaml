        cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug
        -DREQUIRE_NETNS_TESTS=ON
        -DKVM_TESTING=OFF
        -S /context -B /build
      - ninja --quiet
      - ctest --output-on-failure --test-output-size-failed 65536 --timeout 300 -j 12 -L pynfs -E diskfs_
    dependencies:
      builder:
        project: chimera
        task: chimera-dev
        tag: develop

  ctest_debug_other:
    type: run_container
    architecture: [ amd64, arm64 ]
    image: chimera-dev
    context: .
    empty_dir:
      - /build
    privileged: true
    commands:
      - cd /build
      - >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug
        -DREQUIRE_NETNS_TESTS=ON
        -DKVM_TESTING=OFF
        -S /context -B /build
      - ninja --quiet
      - ctest --output-on-failure --test-output-size-failed 65536 --timeout 300 -j 12 -LE pynfs
    dependencies:
      builder:
        project: chimera
        task: chimera-dev
        tag: develop

  ctest_kvm:
    type: run_container
    architecture: [ amd64 ]
    image: chimera-dev
    context: .
    empty_dir:
      - /build
    privileged: true
    variables:
      ORAS_VERSION: 1.2.0
      ORAS_URL: "https://github.com/oras-project/oras/releases/download"
      KVM_FILTER: ""
      MODE: "Debug"
      PLATFORM: "ubuntu2604"
    commands:
      - cd /build
      - export LC_ALL=C
      - echo "KVM_FILTER=${KVM_FILTER}"
      - echo "MODE=${MODE}"
      - echo "PLATFORM=${PLATFORM}"
      # Fail fast if the runner has no KVM device: the guests cannot boot with
      # acceleration without /dev/kvm, so there is no point building chimera and
      # fetching the (~GB) image first.
      - '[ -w /dev/kvm ] || { echo "ERROR: /dev/kvm not present -- this runner has no KVM passthrough"; exit 1; }'
      - >
        curl -sSL "${ORAS_URL}/v${ORAS_VERSION}/oras_${ORAS_VERSION}_linux_$arch.tar.gz"
        | tar -xz -C "/usr/local/bin" oras
      - chmod +x "/usr/local/bin/oras"
      - >
        cmake -G Ninja -DCMAKE_BUILD_TYPE=${MODE}
        -DREQUIRE_NETNS_TESTS=ON
        -DKVM_IMAGE_REGISTRY=repository.mdh.quantum.com:5009/chimera-nas/kvm-test-base
        -DKVM_TESTING=ON
        -DKVM_FETCH_IMAGES=OFF
        -S /context -B /build
      - ninja --quiet
      - ninja kvm_${PLATFORM}_image
      # KVM_FILTER carries the full ctest selector for this leg, e.g. "-R /xfstests/"
      # or "-E /(xfstests|cthon|pnfs|nfstest|ltp)/".  It must stay UNQUOTED so it
      # word-splits into separate args; empty (the default) runs every kvm test for
      # the platform.
      - ctest --output-on-failure -L kvm -L "^${PLATFORM}$" ${KVM_FILTER} -j 12
    dependencies:
      builder:
        project: chimera
        task: chimera-dev
        tag: develop

  static_analysis_release:
    type: run_container
    architecture: [ amd64, arm64 ]
    image: chimera-dev
    context: .
    empty_dir:
      - /build
    commands:
      - cd /context
      - export LC_ALL=C
      - >
        scan-build --status-bugs
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -D IO_URING_NVME_ENABLED=OFF -S . -B /build
      - scan-build --status-bugs ninja -C /build
    dependencies:
      builder:
        project: chimera
        task: chimera-dev
        tag: develop

  static_analysis_release_report:
    type: run_container
    architecture: [ amd64, arm64 ]
    image: chimera-dev
    context: .
    empty_dir:
      - /build
    commands:
      - cd /context
      - mkdir -p /scan-report /dist
      - export LC_ALL=C
      - >
        scan-build -o /scan-report
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -D IO_URING_NVME_ENABLED=OFF -S . -B /build
      - >
        scan-build --keep-empty -o /scan-report ninja -C /build 2>&1 |
        tee /dist/scan-build-output.txt
      - mv /scan-report/* /tmp/analysis
      - tar -C /tmp -czf /dist/report.tar.gz analysis
      - num_bugs=$(grep -i "bugs* found" /dist/scan-build-output.txt | tr -d -c 0-9)
      - echo "$num_bugs" > /dist/num_bugs
    dependencies:
      builder:
        project: chimera
        task: chimera-dev
        tag: develop
    assets:
      - from: /dist
        to: release/scan-report

  static_analysis_debug:
    type: run_container
    architecture: [ amd64, arm64 ]
    image: chimera-dev
    context: .
    empty_dir:
      - /build
    commands:
      - cd /context
      - export LC_ALL=C
      - >
        scan-build --status-bugs
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug -D IO_URING_NVME_ENABLED=OFF -S . -B /build
      - scan-build --status-bugs ninja -C /build
    dependencies:
      builder:
        project: chimera
        task: chimera-dev
        tag: develop

  static_analysis_debug_report:
    type: run_container
    architecture: [ amd64, arm64 ]
    image: chimera-dev
    context: .
    empty_dir:
      - /build
    commands:
      - cd /context
      - mkdir -p /scan-report /dist
      - export LC_ALL=C
      - >
        scan-build -o /scan-report
        cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug -D IO_URING_NVME_ENABLED=OFF -S . -B /build
      - >
        scan-build --keep-empty -o /scan-report ninja -C /build 2>&1 |
        tee /dist/scan-build-output.txt
      - mv /scan-report/* /tmp/analysis
      - tar -C /tmp -czf /dist/report.tar.gz analysis
      - num_bugs=$(grep -i "bugs* found" /dist/scan-build-output.txt | tr -d -c 0-9)
      - echo "$num_bugs" > /dist/num_bugs
    dependencies:
      builder:
        project: chimera
        task: chimera-dev
        tag: develop
    assets:
      - from: /dist
        to: debug/scan-report

# Alias section
aliases:
  builders:
    - builder_Ubuntu22
    - builder_Ubuntu24
    - builder_Ubuntu26
    - builder_Rocky9
  build:
    - build_debug_Ubuntu22
    - build_release_Ubuntu22
    - build_debug_Ubuntu24
    - build_release_Ubuntu24
    - build_debug_Ubuntu26
    - build_release_Ubuntu26
    - build_debug_Rocky9
    - build_release_Rocky9
  ubuntu22:
    - builder_Ubuntu22
    - build_debug_Ubuntu22
    - build_release_Ubuntu22
  ubuntu24:
    - builder_Ubuntu24
    - build_debug_Ubuntu24
    - build_release_Ubuntu24
  ubuntu26:
    - builder_Ubuntu26
    - build_debug_Ubuntu26
    - build_release_Ubuntu26
  rocky9:
    - builder_Rocky9
    - build_debug_Rocky9
    - build_release_Rocky9
  check:
    - chimera-dev
    - ctest_debug_pynfs
    - ctest_debug_other
    - ctest_release_pynfs
    - ctest_release_other
    - static_analysis_debug
    - static_analysis_release
    - syntax
  chimera:
    - builders
    - build
    - check
